<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;


/* ------------------------------------------------------------------ 設定 */
const CAP_TOTAL = 1200;   // 同時在館容留
const CAP_CHILD = 700;    // 全票（3-17 歲）上限　依包場合約第八條
const PR_ROOMS = 2;       // Party Room 兩廳
const PR_PER_ROOM = 25;
const TH_ROOMS = 1;       // Theater 一廳
const TH_SEATS = 72;

const C = {
  ink: "#241A1C",
  sub: "#7A6E6A",
  paper: "#FBF8F2",
  card: "#FFFFFF",
  line: "#E7DFD3",
  brand: "#B02342",
  gold: "#D9A441",
  okText: "#2F6B4F",
  okBg: "#E6F1E9",
  okBar: "#5F9E7A",
  warnText: "#8A5510",
  warnBg: "#FBEEDA",
  warnBar: "#E0A03C",
  badText: "#9B1C2E",
  badBg: "#F7E0E2",
  badBar: "#C4707C",
};

const SEGMENTS = ["學校", "企業", "派對", "營隊", "補教", "公益", "夥伴", "旅行社", "員工", "自然人"];
/** 業務歸屬決定負責窗口，對照寫死，不可在介面上更動 */
const ASSIGNMENTS = {
  "pp年度採購": "Angel",
  "寒暑假營隊": "Angel",
  "平日公私立學校": "Angel",
  "平日課後安親班4H": "Angel",
  "旅行社(公司/寒暑假營隊)": "Lenna",
  "旅行社(平日公私立學校)": "Lenna",
  "旅行社(平日5H系列團)": "Lenna",
  "生日派對/各式派對": "Lenna",
  "公司團體/國際學校": "Lenna",
};
const ownerOf = (a) => ASSIGNMENTS[a] || "";

const PARTY_PLANS = ["同樂派對 6小2大", "歡聚派對 10小4大", "慶典派對 14小6大"];

const FLOW = ["檔期暫留", "已報價", "已確認", "行前作業", "已到訪", "已結案"];
const HOLD_STATES = ["檔期暫留", "已報價", "已確認", "行前作業"];
const EXPIRABLE = ["檔期暫留", "已報價"];

/** 平假日定義由「行事曆」分頁維護，存在資料庫。沒定義的日期才退回週末判斷。 */
let CAL = {};
const setCalendarMap = (m) => { CAL = m; };

/* ------------------------------------------------------------------ 工具 */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());

function isHoliday(dateStr) {
  if (CAL[dateStr]) return CAL[dateStr] === "假日";
  const d = parse(dateStr);
  return d.getDay() === 0 || d.getDay() === 6;
}
const calNote = (dateStr) => (CAL_NOTE[dateStr] || "");
let CAL_NOTE = {};
/** 平日 09:00-20:00、假日 10:00-21:00，各拆成 5H ／ 1H 清場 ／ 5H */
function sessionTime(dateStr, slot) {
  const hol = isHoliday(dateStr);
  if (slot === "上") return hol ? "10:00–15:00" : "09:00–14:00";
  if (slot === "下") return hol ? "16:00–21:00" : "15:00–20:00";
  return hol ? "10:00–21:00" : "09:00–20:00";
}
function daysBetween(a, b) {
  return Math.round((parse(b) - parse(a)) / 86400000);
}
/** 暫留效期跟到訪日連動：越接近越短 */
function holdDays(fromISO, visitISO) {
  const gap = daysBetween(fromISO, visitISO);
  if (gap >= 90) return 14;
  if (gap >= 30) return 7;
  if (gap >= 14) return 3;
  return 2;
}
function addDays(dateStr, n) {
  const d = parse(dateStr); d.setDate(d.getDate() + n); return iso(d);
}
/** 單號：KZ＋年月日時分＋兩碼順序。同一分鐘內的第幾筆就是尾碼。 */
function makeOrderNo(taken) {
  const d = new Date();
  const stem = "KZ" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
             + pad(d.getHours()) + pad(d.getMinutes());
  let i = 1;
  while (taken.has(stem + pad(i))) i++;
  return stem + pad(i);
}

const headcount = (o) => (+o.全票 || 0) + (+o.半票 || 0) + (+o.免票 || 0) + (+o.愛心 || 0);
const isExpired = (o) =>
  EXPIRABLE.includes(o.狀態) && o.到期 && o.到期 < todayISO();
const occupies = (o) => HOLD_STATES.includes(o.狀態) && !isExpired(o);

/* ------------------------------------------------- 名額計算：包場優先 */
function dayStats(orders, dateStr, excludeId) {
  const eff = orders.filter(
    (o) => o.日期 === dateStr && o.id !== excludeId && occupies(o)
  );
  const amLock = eff.find((o) => o.包場 && (o.場次 === "上" || o.場次 === "全")) || null;
  const pmLock = eff.find((o) => o.包場 && (o.場次 === "下" || o.場次 === "全")) || null;
  const buyout = amLock && pmLock ? amLock : null;   // 兩場都鎖才算整天包場
  const sum = (slots, key) =>
    eff.filter((o) => slots.includes(o.場次))
       .reduce((a, o) => a + (key === "child" ? +o.全票 || 0 : headcount(o)), 0);

  const amChild = sum(["上", "全"], "child"), amAll = sum(["上", "全"], "all");
  const pmChild = sum(["下", "全"], "child"), pmAll = sum(["下", "全"], "all");
  const left = (child, all) =>
    Math.max(0, Math.min(CAP_CHILD - child, CAP_TOTAL - all));

  /* 平日不清場，上半場的人可能還在館內，所以整天共用同一個名額池。
     假日強迫清場，上下半場各自獨立計算。 */
  const pooled = !isHoliday(dateStr);
  const dayChild = eff.reduce((a, o) => a + (+o.全票 || 0), 0);
  const dayAll = eff.reduce((a, o) => a + headcount(o), 0);

  const rest = pooled ? left(dayChild, dayAll) : null;
  const am = pooled ? rest : left(amChild, amAll);
  const pm = pooled ? rest : left(pmChild, pmAll);
  const ratio = Math.min(1, dayChild / CAP_CHILD);

  return {
    buyout, amLock, pmLock, eff, pooled,
    am: amLock ? 0 : am,
    pm: pmLock ? 0 : pm,
    full: amLock || pmLock ? 0 : (pooled ? rest : Math.min(am, pm)),
    amChild, pmChild, amAll, pmAll,
    amOther: amAll - amChild, pmOther: pmAll - pmChild,
    dayChild, dayAll,
    peak: pooled ? dayAll : Math.max(amAll, pmAll),
    amRatio: pooled ? ratio : Math.min(1, amChild / CAP_CHILD),
    pmRatio: pooled ? ratio : Math.min(1, pmChild / CAP_CHILD),
  };
}

function toneOf(left) {
  if (left <= 0) return "bad";
  if (left < CAP_CHILD * 0.3) return "warn";
  return "ok";
}
const TONE = {
  ok: { t: C.okText, b: C.okBg, bar: C.okBar },
  warn: { t: C.warnText, b: C.warnBg, bar: C.warnBar },
  bad: { t: C.badText, b: C.badBg, bar: C.badBar },
};

/* ------------------------------------------------------- Supabase 資料層 */
const SUPA_URL = "https://ywvhazatbdmkhpztgyig.supabase.co";
const SUPA_KEY = "sb_publishable_V386LMRY7IEERgMnBc5FCQ_rsoX29zB";
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const toApp = (r) => ({
  id: r.id, 單號: r.order_no, 客戶ID: r.customer_code || "", 單位: r.org, 客群: r.segment,
  業務歸屬: r.assignment || "", 負責窗口: r.owner || "",
  聯絡人: r.contact || "", 電話: r.phone || "", 日期: r.visit_date, 場次: r.slot, 包場: r.buyout,
  全票: r.full_ticket, 半票: r.half_ticket, 免票: r.free_ticket, 愛心: r.love_ticket,
  餐飲: r.meals, 劇院: r.theater, PR廳數: r.party_rooms, PR方案: r.party_plan || "",
  備註: r.note || "", 狀態: r.status, 建立: r.created_on, 到期: r.hold_until,
});

const DB_MAP = {
  單號: "order_no", 客戶ID: "customer_code", 單位: "org", 客群: "segment",
  業務歸屬: "assignment", 負責窗口: "owner",
  聯絡人: "contact", 電話: "phone", 日期: "visit_date", 場次: "slot",
  全票: "full_ticket", 半票: "half_ticket", 免票: "free_ticket", 愛心: "love_ticket",
  餐飲: "meals", 劇院: "theater", PR廳數: "party_rooms", PR方案: "party_plan",
  備註: "note", 狀態: "status", 建立: "created_on", 到期: "hold_until",
};

const toDb = (o) => {
  const d = {};
  for (const k in DB_MAP) if (o[k] !== undefined) d[DB_MAP[k]] = o[k];
  if (o.包場 !== undefined) d.buyout = !!o.包場;
  for (const n of ["full_ticket","half_ticket","free_ticket","love_ticket","meals","theater","party_rooms"])
    if (d[n] !== undefined) d[n] = +d[n] || 0;
  if (d.hold_until === "") d.hold_until = null;
  return d;
};

const clean = (m) => String(m || "").replace(/^.*?:\s*/, "");

/** 預覽權限拿到的是去識別化的逐筆資料：只有單號與人數，沒有單位與聯絡方式 */
const toGuest = (r) => ({
  id: r.order_no, 單號: r.order_no, 單位: "",
  日期: r.visit_date, 場次: r.slot, 包場: r.buyout,
  全票: r.full_ticket, 半票: r.other_ticket, 免票: 0, 愛心: 0,
  狀態: "已確認", 到期: null,
});

function Splash({ text }) {
  return (
    <div className="min-h-screen flex items-center justify-center"
      style={{ background: C.paper, color: C.sub, fontFamily: FONT }}>{text}</div>
  );
}

function LoginPage({ onGuest }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setErr("");
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { setErr("帳號或密碼不對"); setBusy(false); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4"
      style={{ background: C.paper, color: C.ink, fontFamily: FONT }}>
      <style>{CSS}</style>
      <div className="rounded p-6" style={{ background: C.card, border: `1px solid ${C.line}`, width: 320 }}>
        <h1 className="text-lg font-semibold">團體檔期</h1>
        <p className="text-xs mt-1 mb-4" style={{ color: C.sub }}>
          KidZania Taipei　內部使用，需帳號登入
        </p>
        <div className="grid gap-2">
          <input value={email} onChange={(e) => setEmail(e.target.value)}
            placeholder="公司信箱" autoComplete="username" autoFocus style={inp} />
          <input type="password" value={pw} onChange={(e) => setPw(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && go()}
            placeholder="密碼" autoComplete="current-password" style={inp} />
        </div>
        {err && <p className="text-xs mt-2" style={{ color: C.badText }}>{err}</p>}
        <button onClick={go} disabled={busy}
          className="w-full mt-4 px-3 py-2 text-sm rounded"
          style={{ background: C.brand, color: "#fff" }}>
          {busy ? "登入中…" : "登入"}
        </button>
        <button onClick={onGuest}
          className="w-full mt-2 px-3 py-2 text-sm rounded"
          style={{ border: `1px solid ${C.line}`, color: C.sub }}>
          只看檔期
        </button>
        <p className="text-xs mt-3" style={{ color: C.sub }}>
          只看檔期為唯讀，看得到剩餘名額，看不到預約單位，也不能登記。
        </p>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ App */
function App() {
  const [session, setSession] = useState(undefined);   // undefined = 還在確認
  const [orders, setOrders] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("檔期");
  const [cursor, setCursor] = useState({ y: 2026, m: 12 });
  const [picked, setPicked] = useState(null);
  const [formOpen, setFormOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [lastNo, setLastNo] = useState(null);
  const [toast, setToast] = useState(null);

  const say = (m) => { setToast(m); setTimeout(() => setToast(null), 3200); };
  const [guestMode, setGuestMode] = useState(false);
  const [cal, setCal] = useState([]);
  const guest = !session;
  const admin = !guest;

  const loadCal = async () => {
    const { data } = await sb.from("calendar_days").select("*").order("day");
    const m = {}, n = {};
    for (const r of data || []) { m[r.day] = r.kind; n[r.day] = r.note || ""; }
    setCalendarMap(m); CAL_NOTE = n; setCal(data || []);
  };
  useEffect(() => { loadCal(); }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* 訪客：只讀彙總檢視，讀不到任何一筆原始資料 */
  useEffect(() => {
    if (!guestMode || session) return;
    (async () => {
      const { data } = await sb.from("availability").select("*");
      setOrders((data || []).map(toGuest)); setLoaded(true);
    })();
  }, [guestMode, session]);

  /* 已登入：讀完整名單，並開啟即時同步 */
  const reload = async () => {
    const { data, error } = await sb.from("bookings").select("*").order("visit_date");
    if (error) { say("讀取失敗：" + error.message); return; }
    setOrders((data || []).map(toApp));
    setLoaded(true);
  };

  useEffect(() => {
    if (!session) return;
    reload();
    const ch = sb.channel("bookings-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, reload)
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [session]);

  const getDay = (date) => dayStats(orders, date);

  const addOrder = async (o) => {
    const created = todayISO();
    const rec = {
      ...o,
      單號: makeOrderNo(new Set(orders.map((x) => x.單號))),
      客戶ID: "",
      狀態: "檔期暫留",
      建立: created,
      到期: addDays(created, holdDays(created, o.日期)),
    };
    const { error } = await sb.from("bookings").insert(toDb(rec));
    if (error) { say(clean(error.message)); return; }
    setFormOpen(false); setPicked(o.日期); setLastNo(rec.單號);
    await reload();
  };

  const patch = async (id, fields) => {
    const { error } = await sb.from("bookings").update(fields).eq("id", id);
    if (error) { say(clean(error.message)); return false; }
    await reload();
    return true;
  };

  const setField = (id, key, val) => patch(id, toDb({ [key]: val }));

  const updateOrder = async (o) => {
    if (await patch(o.id, toDb(o))) { setEditing(null); say("已更新，名額同步重算"); }
  };

  const move = async (id, status) => {
    const o = orders.find((x) => x.id === id);
    const f = { status };
    if (status === "檔期暫留") f.hold_until = addDays(todayISO(), holdDays(todayISO(), o.日期));
    if (!EXPIRABLE.includes(status) && status !== "流失") f.hold_until = null;
    await patch(id, f);
  };

  const renew = async (id) => {
    const o = orders.find((x) => x.id === id);
    if (await patch(id, { hold_until: addDays(todayISO(), holdDays(todayISO(), o.日期)) }))
      say("保留期已重新計算");
  };

  const saveCal = async (rows) => {
    const { error } = await sb.from("calendar_days").upsert(rows, { onConflict: "day" });
    if (error) { say(clean(error.message)); return false; }
    await loadCal();
    say(`已更新 ${rows.length} 個日期`);
    return true;
  };

  const delCal = async (day) => {
    const { error } = await sb.from("calendar_days").delete().eq("day", day);
    if (error) { say(clean(error.message)); return; }
    await loadCal();
  };

  const remove = async (id) => {
    const { error } = await sb.from("bookings").delete().eq("id", id);
    if (error) { say(clean(error.message)); return; }
    await reload();
  };

  if (session === undefined) return <Splash text="載入中…" />;
  if (!session && !guestMode) return <LoginPage onGuest={() => setGuestMode(true)} />;

  const expiredList = orders.filter(isExpired);

  if (!loaded) return <Splash text="讀取檔期資料…" />;

  return (
    <div className="min-h-screen" style={{ background: C.paper, color: C.ink, fontFamily: FONT }}>
      <style>{CSS}</style>

      <header className="px-4 pt-5 pb-3" style={{ borderBottom: `1px solid ${C.line}` }}>
        <div className="max-w-5xl mx-auto">
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <div>
              <h1 className="text-xl font-semibold tracking-tight">團體檔期</h1>
              <p className="text-xs mt-1" style={{ color: C.sub }}>
                {guest
                  ? "預覽權限　可查看檔期與各團人數，不顯示預約單位"
                  : `全票上限 ${CAP_CHILD} 位・同時容留 ${CAP_TOTAL} 位・包場當日不再對外開放`}
              </p>
            </div>
            <nav className="flex gap-1 items-center">
              {(guest ? ["檔期"] : ["檔期", "任務", "匯出", "行事曆"]).map((t) => (
                <button key={t} onClick={() => setTab(t)} className="px-3 py-1.5 text-sm rounded"
                  style={tab === t
                    ? { background: C.brand, color: "#fff" }
                    : { color: C.sub, background: "transparent" }}>
                  {t}
                  {t === "任務" && expiredList.length > 0 && (
                    <span className="ml-1.5 text-xs px-1.5 rounded"
                      style={{ background: tab === t ? "#fff" : C.badBg, color: C.badText }}>
                      {expiredList.length}
                    </span>
                  )}
                </button>
              ))}
              {guest ? (
                <button onClick={() => { setGuestMode(false); setLoaded(false); }}
                  className="ml-1 px-3 py-1.5 text-sm rounded"
                  style={{ background: C.brand, color: "#fff" }}>登入</button>
              ) : (
                <button onClick={() => sb.auth.signOut()}
                  className="ml-1 px-2.5 py-1.5 text-xs rounded"
                  style={{ border: `1px solid ${C.line}`, color: C.sub }}>登出</button>
              )}
            </nav>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-5">
        {lastNo && (
          <div className="mb-4 rounded p-4 flex items-center justify-between gap-3 flex-wrap"
            style={{ background: C.card, border: `2px solid ${C.brand}` }}>
            <div>
              <p className="text-xs" style={{ color: C.sub }}>已登記，請記下單號</p>
              <p className="text-xl font-semibold tnum" style={{ color: C.brand }}>{lastNo}</p>
              <p className="text-xs mt-1" style={{ color: C.sub }}>
                報價與收款以這組單號對應，系統不記錄金額。
              </p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => navigator.clipboard?.writeText(lastNo)}
                className="px-3 py-2 text-sm rounded" style={{ border: `1px solid ${C.line}` }}>
                複製
              </button>
              <button onClick={() => setLastNo(null)}
                className="px-3 py-2 text-sm rounded" style={{ background: C.brand, color: "#fff" }}>
                知道了
              </button>
            </div>
          </div>
        )}
        {tab === "檔期" && (
          <CalendarView
            getDay={getDay} cursor={cursor} setCursor={setCursor}
            picked={picked} setPicked={setPicked} admin={admin} guest={guest}
            onNew={(d) => { setPicked(d); setFormOpen(true); }}
          />
        )}
        {tab === "任務" && admin && (
          <TaskView orders={orders} onMove={move} onRenew={renew} onRemove={remove} onEdit={setEditing} onField={setField} />
        )}
        {tab === "匯出" && admin && <ExportView orders={orders} say={say} />}
        {tab === "行事曆" && admin && (
          <CalendarAdmin cal={cal} onSave={saveCal} onDelete={delCal} say={say} />
        )}

        {(formOpen || editing) && (
          <RequestForm
            date={picked} orders={orders} editing={editing}
            onClose={() => { setFormOpen(false); setEditing(null); }}
            onSubmit={editing ? updateOrder : addOrder}
          />
        )}
      </main>

      {toast && (
        <div className="fixed left-1/2 bottom-6 px-4 py-2.5 rounded text-sm toast"
          style={{ transform: "translateX(-50%)", background: C.ink, color: C.paper, maxWidth: "90vw" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------ 檔期預覽 */
function CalendarView({ getDay, cursor, setCursor, picked, setPicked, onNew, admin, guest }) {
  const { y, m } = cursor;
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const lead = first.getDay();

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(iso(new Date(y, m - 1, d)));
  while (cells.length % 7) cells.push(null);

  const step = (n) => {
    let mm = m + n, yy = y;
    if (mm > 12) { mm = 1; yy++; } if (mm < 1) { mm = 12; yy--; }
    setCursor({ y: yy, m: mm }); setPicked(null);
  };

  return (
    <>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-3">
          <button onClick={() => step(-1)} className="w-8 h-8 rounded text-lg leading-none"
            style={{ border: `1px solid ${C.line}`, background: C.card }} aria-label="上個月">‹</button>
          <div className="text-lg font-semibold tnum" style={{ minWidth: "7.5rem" }}>
            {y} 年 {m} 月
          </div>
          <button onClick={() => step(1)} className="w-8 h-8 rounded text-lg leading-none"
            style={{ border: `1px solid ${C.line}`, background: C.card }} aria-label="下個月">›</button>
        </div>
        <div className="flex items-center gap-3 text-xs" style={{ color: C.sub }}>
          <Legend color={C.okBar} label="可售" />
          <Legend color={C.warnBar} label="吃緊" />
          <Legend color={C.badBar} label="不可售" />
        </div>
      </div>

      <div className="grid grid-cols-7 gap-px rounded overflow-hidden"
        style={{ background: C.line, border: `1px solid ${C.line}` }}>
        {["日", "一", "二", "三", "四", "五", "六"].map((w) => (
          <div key={w} className="text-center text-xs py-1.5"
            style={{ background: C.card, color: C.sub }}>{w}</div>
        ))}
        {cells.map((d, i) =>
          d === null
            ? <div key={i} style={{ background: C.paper, minHeight: 76 }} />
            : <DayCell key={d} date={d} s={getDay(d)}
                selected={picked === d} onClick={() => setPicked(picked === d ? null : d)} />
        )}
      </div>

      {picked
        ? <DayPanel date={picked} s={getDay(picked)} onNew={onNew} admin={admin} guest={guest} />
        : <p className="text-sm mt-4" style={{ color: C.sub }}>
            點一個日期看細節，或直接登記需求。
          </p>}
    </>
  );
}

function Legend({ color, label }) {
  return (
    <span className="flex items-center gap-1.5">
      <span style={{ width: 14, height: 4, background: color, borderRadius: 2 }} />
      {label}
    </span>
  );
}

function DayCell({ date, s, selected, onClick }) {
  const d = parse(date);
  const hol = isHoliday(date);
  const bo = !!(s.amLock && s.pmLock);

  return (
    <button onClick={onClick} className="text-left p-1.5 flex flex-col gap-1"
      style={{
        background: bo ? C.badBg : C.card,
        minHeight: 76,
        boxShadow: selected ? `inset 0 0 0 2px ${C.brand}` : "none",
      }}>
      <span className="text-xs tnum" style={{ color: hol ? C.brand : C.sub, fontWeight: hol ? 600 : 400 }}>
        {d.getDate()}
      </span>

      {bo ? (
        <span className="text-xs font-semibold mt-1" style={{ color: C.badText }}>包場</span>
      ) : (
        <>
          <Bar ratio={s.amLock ? 1 : s.amRatio} left={s.amLock ? 0 : s.am} />
          <Bar ratio={s.pmLock ? 1 : s.pmRatio} left={s.pmLock ? 0 : s.pm} />
          <span className="text-xs tnum mt-auto"
            style={{ color: s.amLock || s.pmLock ? C.badText : TONE[toneOf(s.full)].t }}>
            {s.amLock ? "上包場" : s.pmLock ? "下包場"
              : s.full <= 0 ? "額滿" : s.peak > 0 ? `已訂 ${s.peak}` : ""}
          </span>
        </>
      )}
    </button>
  );
}

/** 上下半場各一條，滿格代表全票 700 用完 */
function Bar({ ratio, left }) {
  const tone = TONE[toneOf(left)];
  return (
    <span style={{ display: "block", height: 4, background: C.line, borderRadius: 2 }}>
      <span style={{
        display: "block", height: 4, borderRadius: 2,
        width: `${Math.max(ratio * 100, ratio > 0 ? 6 : 0)}%`,
        background: tone.bar,
      }} />
    </span>
  );
}

function DayPanel({ date, s, onNew, admin, guest }) {
  const d = parse(date);
  const wk = "日一二三四五六"[d.getDay()];
  const hol = isHoliday(date);

  return (
    <section className="mt-4 rounded p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2 mb-3">
        <h2 className="font-semibold tnum">
          {date}（{wk}）
          <span className="ml-2 text-xs font-normal" style={{ color: hol ? C.brand : C.sub }}>
            {hol ? "假日" : "平日"}
          </span>
        </h2>
        {!guest && (
          <button onClick={() => onNew(date)} className="px-3 py-1.5 text-sm rounded"
            style={{ background: C.brand, color: "#fff" }}>
            登記需求
          </button>
        )}
      </div>

      {s.amLock && s.pmLock ? (
        <div className="rounded p-3 text-sm" style={{ background: C.badBg, color: C.badText }}>
          <strong>當日已包場</strong>，不再對外開放，上下半場一律不可售。
          {!guest && s.buyout.單位 && (
            <div className="mt-1" style={{ color: C.ink }}>
              {s.buyout.單位}・{s.buyout.場次 === "全" ? "整天" : s.buyout.場次 + "半場"}・{s.buyout.狀態}
            </div>
          )}
        </div>
      ) : (
        <>
        <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))" }}>
          <Slot name="上半場" time={sessionTime(date, "上")} left={s.am}
            booked={s.amAll} child={s.amChild} other={s.amOther}
            lock={s.amLock} guest={guest} />
          <Slot name="下半場" time={sessionTime(date, "下")} left={s.pm}
            booked={s.pmAll} child={s.pmChild} other={s.pmOther}
            lock={s.pmLock} guest={guest} />
          {!hol && !s.amLock && !s.pmLock && (
            <Slot name="整天" time={sessionTime(date, "全")} left={s.full}
              booked={s.dayAll} child={s.dayChild} other={s.dayAll - s.dayChild}
              note="同時佔用上下半場" />
          )}
        </div>
        <p className="text-xs mt-2" style={{ color: C.sub }}>
          {hol
            ? "假日兩場之間強迫清場，整天僅開放包場。上下半場各自售滿才是當日上限。"
            : `平日不清場，上下半場共用名額池。當日已訂 ${s.dayAll} 人（全票 ${s.dayChild}），整日上限 ${CAP_TOTAL} 人、全票 ${CAP_CHILD}。`}
        </p>
        {!hol && s.dayAll > 0 && (
          <p className="text-xs mt-1 tnum" style={{ color: C.sub }}>
            團體保守值取上半場不離場計算。若上半場全數離場，下半場現場最多可再收
            <span style={{ color: C.brand, fontWeight: 600 }}>{" "}{Math.max(0, Math.min(CAP_CHILD - s.pmChild, CAP_TOTAL - s.pmAll))}{" "}</span>
            人。
          </p>
        )}
        </>
      )}

      {s.eff.length > 0 && (
        <ul className="mt-3 text-sm" style={{ borderTop: `1px solid ${C.line}` }}>
          {s.eff.map((o) => (
            <li key={o.id} className="py-2 flex justify-between gap-3 flex-wrap"
              style={{ borderBottom: `1px solid ${C.line}` }}>
              <span className={guest ? "tnum" : ""}>
                {guest ? o.單號 : o.單位}
                <span className="ml-2 text-xs tnum" style={{ color: C.sub }}>
                  {o.場次 === "全" ? "整天" : o.場次 + "半場"}
                  ・{headcount(o)} 人（全票 {o.全票}）
                </span>
              </span>
              {!guest && <span className="text-xs" style={{ color: C.sub }}>{o.狀態}</span>}
            </li>
          ))}
        </ul>
      )}
    </section>
  );
}

function Slot({ name, time, left, booked, child, other, note, lock, guest }) {
  const tone = TONE[toneOf(left)];
  if (lock) {
    return (
      <div className="rounded p-3" style={{ background: C.badBg }}>
        <div className="text-xs" style={{ color: C.badText }}>{name}　{time}</div>
        <div className="text-xl font-semibold mt-1" style={{ color: C.badText }}>已包場</div>
        <div className="text-xs mt-1" style={{ color: C.badText, opacity: .9 }}>
          {guest ? lock.單號 : lock.單位}
        </div>
      </div>
    );
  }
  return (
    <div className="rounded p-3" style={{ background: tone.b }}>
      <div className="text-xs" style={{ color: tone.t }}>{name}　{time}</div>
      <div className="text-2xl font-semibold tnum mt-1" style={{ color: tone.t }}>
        {booked}
        <span className="text-xs font-normal ml-1" style={{ opacity: .8 }}>人已訂</span>
      </div>
      <div className="text-xs mt-1 tnum" style={{ color: tone.t, opacity: .9 }}>
        全票 {child}　其他 {other}
      </div>
      <div className="text-xs mt-2 pt-2 tnum"
        style={{ color: tone.t, borderTop: `1px solid ${tone.t}22` }}>
        {left > 0 ? `尚可售全票 ${left}` : "額滿"}
        {note ? `　${note}` : ""}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------ 需求登記 */
function RequestForm({ date, orders, editing, onClose, onSubmit }) {
  const [f, setF] = useState(() => editing ? { ...editing } : {
    單位: "", 客群: "學校", 業務歸屬: "", 聯絡人: "", 電話: "",
    日期: date || todayISO(), 包場: false, 場次: "上",
    全票: "", 半票: "", 免票: "", 愛心: "",
    餐飲: 0, 劇院: 0, PR廳數: 0, PR方案: "", 備註: "",
  });
  const set = (k, v) => setF((p) => {
    const n = { ...p, [k]: v };
    if (!n.包場 && n.場次 === "全" && isHoliday(n.日期)) n.場次 = "上";
    return n;
  });

  /** 包場＝場域內所有可獨立販售的品項一併保留，先幫使用者勾好，仍可調整 */
  const setBuyout = (on) =>
    setF((p) => on
      ? { ...p, 包場: true, 劇院: TH_ROOMS, PR廳數: PR_ROOMS }
      : { ...p, 包場: false });

  const s = useMemo(
    () => dayStats(orders, f.日期, editing?.id),
    [orders, f.日期, editing]
  );

  const slotLeft = f.場次 === "上" ? s.am : f.場次 === "下" ? s.pm : s.full;
  const child = +f.全票 || 0;
  const total = headcount(f);

  const errors = [];
  if (!f.單位.trim()) errors.push("填一下單位名稱");
  if (!f.包場 && f.場次 === "全" && isHoliday(f.日期))
    errors.push("假日強迫清場，整天僅開放包場。請改選上半場或下半場");
  if (!f.業務歸屬) errors.push("選一個業務歸屬，負責窗口會自動帶出");
  const overlaps = (a, b) => a === "全" || b === "全" || a === b;
  const lock = f.場次 === "上" ? s.amLock : f.場次 === "下" ? s.pmLock : (s.amLock || s.pmLock);
  if (lock) errors.push(`這個時段已被 ${lock.單位 || lock.單號} 包場，請改場次或改期`);
  const clash = s.eff.filter((o) => overlaps(o.場次, f.場次));
  if (f.包場 && clash.length > 0 && !lock)
    errors.push("這個時段已有其他訂單，包場需要獨佔，請改期或先處理既有訂單");
  if (!f.包場) {
    if (child <= 0) errors.push("全票人數要大於 0");
    if (child > slotLeft) errors.push(`全票超出可售名額，這個場次只剩 ${slotLeft} 位`);
    if (total > CAP_TOTAL) errors.push(`總人數超過容留上限 ${CAP_TOTAL} 位`);
  } else {
    if (child > CAP_CHILD) errors.push(`包場全票上限 ${CAP_CHILD} 位`);
    if (total > CAP_TOTAL) errors.push(`包場總人數上限 ${CAP_TOTAL} 位`);
  }
  if (+f.餐飲 > total && total > 0) errors.push(`餐飲數量超過總人數 ${total} 位`);

  const expiry = addDays(todayISO(), holdDays(todayISO(), f.日期));

  const box = useRef(null);
  useEffect(() => {
    box.current?.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);

  return (
    <div ref={box} className="mt-4 rounded scroll-mt-4"
      style={{ background: C.card, border: `2px solid ${C.brand}` }}>
      <div>

        <div className="px-4 py-3 flex items-center justify-between"
          style={{ background: C.card, borderBottom: `1px solid ${C.line}` }}>
          <h2 className="font-semibold">{editing ? `修改需求　${editing.客戶ID}` : "登記團體需求"}</h2>
          <button onClick={onClose} className="text-xl leading-none px-2" style={{ color: C.sub }}>×</button>
        </div>

        <div className="p-4 grid gap-3">
          <Row>
            <Field label="單位名稱" wide>
              <input value={f.單位} onChange={(e) => set("單位", e.target.value)}
                placeholder="例：新北市土城區清水國小" style={inp} />
            </Field>
          </Row>
          <Row>
            <Field label="業務歸屬" wide>
              <select value={f.業務歸屬} onChange={(e) => set("業務歸屬", e.target.value)} style={inp}>
                <option value="">請選擇</option>
                {Object.keys(ASSIGNMENTS).map((x) => <option key={x}>{x}</option>)}
              </select>
            </Field>
            <Field label="負責窗口">
              <div className="rounded px-3 py-2 text-sm"
                style={{ border: `1px solid ${C.line}`, background: C.paper,
                         color: f.業務歸屬 ? C.brand : C.sub, fontWeight: f.業務歸屬 ? 600 : 400 }}>
                {ownerOf(f.業務歸屬) || "選了業務歸屬就會帶出"}
              </div>
            </Field>
            <Field label="客群">
              <select value={f.客群} onChange={(e) => set("客群", e.target.value)} style={inp}>
                {SEGMENTS.map((x) => <option key={x}>{x}</option>)}
              </select>
            </Field>
            <Field label="聯絡人">
              <input value={f.聯絡人} onChange={(e) => set("聯絡人", e.target.value)} style={inp} />
            </Field>
            <Field label="電話">
              <input value={f.電話} onChange={(e) => set("電話", e.target.value)} style={inp} />
            </Field>
          </Row>

          <div className="rounded p-3" style={{ background: C.paper }}>
            <Row>
              <Field label="到訪日期">
                <input type="date" value={f.日期} onChange={(e) => set("日期", e.target.value)} style={inp} />
              </Field>
              <Field label="包場">
                <select value={f.包場 ? "是" : "否"} onChange={(e) => setBuyout(e.target.value === "是")} style={inp}>
                  <option>否</option><option>是</option>
                </select>
              </Field>
              <Field label={f.包場 ? "包場範圍" : "場次"}>
                <select value={f.場次} onChange={(e) => set("場次", e.target.value)} style={inp}>
                  <option value="上">上半場</option>
                  <option value="下">下半場</option>
                  {(f.包場 || !isHoliday(f.日期)) && <option value="全">整天</option>}
                </select>
              </Field>
            </Row>
            <p className="text-xs mt-2 tnum" style={{ color: C.sub }}>
              {isHoliday(f.日期) ? "假日" : "平日"}　{sessionTime(f.日期, f.場次)}
              {!s.buyout && !f.包場 && `　可售全票 ${slotLeft}`}
            </p>
          </div>

          <Row>
            <Field label="全票 3-17 歲">
              <input type="number" min="0" value={f.全票} onChange={(e) => set("全票", e.target.value)} style={inp} />
            </Field>
            <Field label="半票 18 歲以上">
              <input type="number" min="0" value={f.半票} onChange={(e) => set("半票", e.target.value)} style={inp} />
            </Field>
            <Field label="免票 未滿 3 歲">
              <input type="number" min="0" value={f.免票} onChange={(e) => set("免票", e.target.value)} style={inp} />
            </Field>
            <Field label="愛心票">
              <input type="number" min="0" value={f.愛心} onChange={(e) => set("愛心", e.target.value)} style={inp} />
            </Field>
          </Row>

          <div className="rounded p-3 grid gap-2" style={{ background: C.paper }}>
            <div className="flex items-baseline justify-between">
              <span className="text-xs font-medium">加購品項</span>
              {f.包場 && (
                <span className="text-xs" style={{ color: C.brand }}>
                  包場已自動保留全部場地，仍可調整
                </span>
              )}
            </div>
            <Row>
              <Field label="餐飲　數量">
                <input type="number" min="0" value={f.餐飲}
                  onChange={(e) => set("餐飲", +e.target.value || 0)} style={inp} />
              </Field>
              <Field label={`劇院　數量（上限 ${TH_ROOMS}）`}>
                <select value={f.劇院} onChange={(e) => set("劇院", +e.target.value)} style={inp}>
                  <option value={0}>0</option><option value={1}>1</option>
                </select>
              </Field>
              <Field label={`派對廳　數量（上限 ${PR_ROOMS}）`}>
                <select value={f.PR廳數} onChange={(e) => set("PR廳數", +e.target.value)} style={inp}>
                  <option value={0}>0</option><option value={1}>1</option><option value={2}>2</option>
                </select>
              </Field>
              {f.PR廳數 > 0 && (
                <Field label={`派對方案（每廳 ${PR_PER_ROOM} 位）`} wide>
                  <select value={f.PR方案} onChange={(e) => set("PR方案", e.target.value)} style={inp}>
                    <option value="">請選擇</option>
                    {PARTY_PLANS.map((p) => <option key={p}>{p}</option>)}
                  </select>
                </Field>
              )}
            </Row>
            <p className="text-xs" style={{ color: C.sub }}>
              劇院 {TH_SEATS} 席・派對廳每廳 {PR_PER_ROOM} 位
            </p>
          </div>

          <Field label="備註" wide>
            <textarea rows={2} value={f.備註} onChange={(e) => set("備註", e.target.value)} style={inp} />
          </Field>

          {errors.length > 0 && (
            <ul className="rounded p-3 text-sm" style={{ background: C.badBg, color: C.badText }}>
              {errors.map((e, i) => <li key={i}>{e}</li>)}
            </ul>
          )}

          <p className="text-xs" style={{ color: C.sub }}>
            {editing
              ? `狀態維持「${editing.狀態}」，名額會依新內容重算。保留到期日不變。`
              : <>送出後檔期進入暫留，保留到 <span className="tnum">{expiry}</span>。未收到訂金會自動釋出，不需要手動取消。</>}
          </p>
        </div>

        <div className="px-4 py-3 flex gap-2"
          style={{ background: C.card, borderTop: `1px solid ${C.line}` }}>
          <button onClick={onClose} className="px-4 py-2 text-sm rounded flex-1"
            style={{ border: `1px solid ${C.line}` }}>取消</button>
          <button disabled={errors.length > 0}
            onClick={() => onSubmit({ ...f, 負責窗口: ownerOf(f.業務歸屬),
              全票: +f.全票 || 0, 半票: +f.半票 || 0, 免票: +f.免票 || 0, 愛心: +f.愛心 || 0, 餐飲: +f.餐飲 || 0 })}
            className="px-4 py-2 text-sm rounded flex-1"
            style={errors.length
              ? { background: C.line, color: C.sub }
              : { background: C.brand, color: "#fff" }}>
            {editing ? "儲存修改" : "登記並暫留檔期"}
          </button>
        </div>
      </div>
    </div>
  );
}

const inp = {
  width: "100%", padding: "7px 9px", borderRadius: 4,
  border: `1px solid ${C.line}`, background: "#fff", fontSize: 14, color: C.ink,
};
const Row = ({ children }) => <div className="flex flex-wrap gap-3">{children}</div>;
function Field({ label, children, wide }) {
  return (
    <label className="grid gap-1" style={{ flex: wide ? "1 1 100%" : "1 1 8rem", minWidth: "8rem" }}>
      <span className="text-xs" style={{ color: C.sub }}>{label}</span>
      {children}
    </label>
  );
}

/* ---------------------------------------------------------------- 任務板 */
function TaskView({ orders, onMove, onRenew, onRemove, onEdit, onField }) {
  const [filter, setFilter] = useState("進行中");
  const expired = orders.filter(isExpired);
  const live = orders.filter((o) => !["已結案", "流失", "已到訪"].includes(o.狀態) && !isExpired(o));
  const done = orders.filter((o) => ["已結案", "流失", "已到訪"].includes(o.狀態));
  const list = filter === "進行中" ? live : filter === "逾期" ? expired : done;

  if (!orders.length) {
    return (
      <div className="rounded p-8 text-center" style={{ background: C.card, border: `1px dashed ${C.line}` }}>
        <p className="font-medium">還沒有任何需求單</p>
        <p className="text-sm mt-1" style={{ color: C.sub }}>
          回到檔期頁，點一個日期就能登記第一筆。
        </p>
      </div>
    );
  }

  return (
    <>
      <div className="flex gap-1 mb-3">
        {[["進行中", live.length], ["逾期", expired.length], ["已結束", done.length]].map(([k, n]) => (
          <button key={k} onClick={() => setFilter(k)} className="px-3 py-1.5 text-sm rounded"
            style={filter === k
              ? { background: C.ink, color: C.paper }
              : { color: C.sub, border: `1px solid ${C.line}` }}>
            {k} <span className="tnum">{n}</span>
          </button>
        ))}
      </div>

      {filter === "逾期" && expired.length > 0 && (
        <p className="text-sm mb-3 rounded p-3" style={{ background: C.warnBg, color: C.warnText }}>
          這些單的保留期已過，名額已經自動還回檔期。續期會重新計算保留日，標記流失則收進已結束。
        </p>
      )}

      {list.length === 0
        ? <p className="text-sm" style={{ color: C.sub }}>這一區目前是空的。</p>
        : <ul className="grid gap-2">
            {list.map((o) => (
              <TaskCard key={o.id} o={o} onMove={onMove} onRenew={onRenew} onRemove={onRemove} onEdit={onEdit} onField={onField} />
            ))}
          </ul>}
    </>
  );
}

function TaskCard({ o, onMove, onRenew, onRemove, onEdit, onField }) {
  const exp = isExpired(o);
  const idx = FLOW.indexOf(o.狀態);
  const next = idx >= 0 && idx < FLOW.length - 1 ? FLOW[idx + 1] : null;
  const dLeft = o.到期 ? daysBetween(todayISO(), o.到期) : null;

  return (
    <li className="rounded p-3" style={{
      background: C.card,
      border: `1px solid ${exp ? C.badBar : C.line}`,
    }}>
      <div className="flex justify-between gap-3 flex-wrap">
        <div>
          <div className="font-medium">{o.單位}</div>
          <div className="text-xs mt-0.5 tnum" style={{ color: C.sub }}>
            {o.單號 || "—"}・{o.日期}　{o.包場 ? "包場" : o.場次 === "全" ? "整天" : o.場次 + "半場"}
            ・全票 {o.全票}・共 {headcount(o)} 位
          </div>
          <div className="text-xs mt-0.5" style={{ color: C.sub }}>
            {o.業務歸屬 && <span>{o.業務歸屬}　</span>}
            {o.負責窗口 && <span style={{ color: C.brand, fontWeight: 600 }}>{o.負責窗口}</span>}
          </div>
          {o.聯絡人 && <div className="text-xs mt-0.5" style={{ color: C.sub }}>
            {o.聯絡人} {o.電話}
          </div>}
          {(o.餐飲 > 0 || o.劇院 > 0 || o.PR廳數 > 0) && (
            <div className="text-xs mt-0.5" style={{ color: C.sub }}>
              {[o.餐飲 > 0 && `餐飲 ${o.餐飲}`,
                o.劇院 > 0 && `劇院 ${o.劇院}`,
                o.PR廳數 > 0 && `派對廳 ${o.PR廳數}${o.PR方案 ? "・" + o.PR方案 : ""}`]
                .filter(Boolean).join("　")}
            </div>
          )}
        </div>
        <div className="text-right">
          <span className="text-xs px-2 py-0.5 rounded" style={{ background: C.paper, color: C.ink }}>
            {o.狀態}
          </span>
          {o.到期 && EXPIRABLE.includes(o.狀態) && (
            <div className="text-xs mt-1 tnum" style={{ color: exp ? C.badText : C.sub }}>
              {exp ? `已逾期 ${-dLeft} 天` : `保留剩 ${dLeft} 天`}
            </div>
          )}
        </div>
      </div>

      <label className="flex items-center gap-2 mt-2">
        <span className="text-xs whitespace-nowrap" style={{ color: C.sub }}>客戶代號</span>
        <input defaultValue={o.客戶ID || ""} placeholder="依貴司編碼規則填寫"
          onBlur={(e) => e.target.value !== (o.客戶ID || "") && onField(o.id, "客戶ID", e.target.value.trim())}
          className="tnum" style={{ ...inp, padding: "4px 7px", fontSize: 12, maxWidth: 200 }} />
      </label>

      <div className="flex gap-2 mt-3 flex-wrap">
        {exp && (
          <button onClick={() => onRenew(o.id)} className="px-2.5 py-1 text-xs rounded"
            style={{ background: C.gold, color: C.ink }}>續期</button>
        )}
        {next && !exp && (
          <button onClick={() => onMove(o.id, next)} className="px-2.5 py-1 text-xs rounded"
            style={{ background: C.brand, color: "#fff" }}>推進到「{next}」</button>
        )}
        {o.狀態 !== "流失" && (
          <button onClick={() => onMove(o.id, "流失")} className="px-2.5 py-1 text-xs rounded"
            style={{ border: `1px solid ${C.line}`, color: C.sub }}>標記流失</button>
        )}
        <button onClick={() => onEdit(o)} className="px-2.5 py-1 text-xs rounded"
          style={{ border: `1px solid ${C.line}` }}>修改內容</button>
        <button onClick={() => onRemove(o.id)} className="px-2.5 py-1 text-xs rounded ml-auto"
          style={{ color: C.badText }}>刪除</button>
      </div>
    </li>
  );
}

/* ------------------------------------------------------------- 行事曆維護 */
/** 把上傳或貼上的資料整理成 {day, note, kind}，看不懂的列直接丟掉 */
function parseCalendar(raw) {
  const norm = (v) => {
    if (v instanceof Date) return iso(v);
    if (typeof v === "number")            // Excel 序列日期
      return iso(new Date(Date.UTC(1899, 11, 30 + v)));
    const t = String(v || "").trim().replace(/[./]/g, "-");
    const m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
  };
  const kindOf = (v) => {
    const t = String(v || "").trim();
    if (/假/.test(t) && !/^平/.test(t)) return "假日";
    if (/平|工作|上班/.test(t)) return "平日";
    return "";
  };
  const out = [], seen = new Set();
  for (const r of raw) {
    const day = norm(r[0]), kind = kindOf(r[2]);
    if (!day || !kind || seen.has(day)) continue;
    seen.add(day);
    out.push({ day, note: String(r[1] || "").trim(), kind });
  }
  return out;
}

function CalendarAdmin({ cal, onSave, onDelete, say }) {
  const [preview, setPreview] = useState(null);
  const [text, setText] = useState("");
  const file = useRef(null);

  const takeFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { cellDates: true });
      const sh = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true });
      const parsed = parseCalendar(rows);
      parsed.length ? setPreview(parsed) : say("讀不到可用的資料，請確認三欄順序為 日期／說明／平假日");
    } catch (err) {
      say("檔案讀取失敗，請改用貼上");
    }
    e.target.value = "";
  };

  const takeText = () => {
    const rows = text.trim().split(/\r?\n/).map((l) => l.split(/\t|,/));
    const parsed = parseCalendar(rows);
    parsed.length ? setPreview(parsed) : say("讀不到可用的資料，一行一天，用 Tab 或逗號分隔");
  };

  const commit = async () => {
    if (await onSave(preview)) { setPreview(null); setText(""); }
  };

  const holi = cal.filter((r) => r.kind === "假日").length;

  return (
    <>
      <div className="rounded p-4 mb-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <h2 className="font-semibold">匯入平假日定義</h2>
        <p className="text-xs mt-1 mb-3" style={{ color: C.sub }}>
          三欄，順序固定：<span className="tnum">日期</span>／說明／平假日。
          日期可用 2027-01-01 或 2027/1/1；第三欄寫「平日」或「假日」。
          第一列是標題也沒關係，讀不懂的列會自動略過。同一天重複匯入會覆蓋舊的。
        </p>

        <div className="flex gap-2 flex-wrap items-center">
          <button onClick={() => file.current?.click()}
            className="px-3 py-2 text-sm rounded" style={{ background: C.brand, color: "#fff" }}>
            上傳 Excel 或 CSV
          </button>
          <input ref={file} type="file" accept=".xlsx,.xls,.csv" onChange={takeFile} className="hidden" />
          <span className="text-xs" style={{ color: C.sub }}>或直接貼上 ↓</span>
        </div>

        <textarea rows={4} value={text} onChange={(e) => setText(e.target.value)}
          placeholder={"2027-01-01\t元旦\t假日\n2027-01-02\t\t假日\n2027-01-04\t\t平日"}
          style={{ ...inp, marginTop: 8, fontFamily: "inherit" }} />
        <button onClick={takeText} disabled={!text.trim()}
          className="mt-2 px-3 py-2 text-sm rounded"
          style={text.trim() ? { border: `1px solid ${C.line}` } : { background: C.line, color: C.sub }}>
          讀取貼上的內容
        </button>
      </div>

      {preview && (
        <div className="rounded p-4 mb-4" style={{ background: C.card, border: `2px solid ${C.brand}` }}>
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <p className="font-medium tnum">
              讀到 {preview.length} 個日期
              <span className="text-xs font-normal ml-2" style={{ color: C.sub }}>
                假日 {preview.filter((r) => r.kind === "假日").length}・
                平日 {preview.filter((r) => r.kind === "平日").length}
              </span>
            </p>
            <div className="flex gap-2">
              <button onClick={() => setPreview(null)} className="px-3 py-1.5 text-sm rounded"
                style={{ border: `1px solid ${C.line}` }}>取消</button>
              <button onClick={commit} className="px-3 py-1.5 text-sm rounded"
                style={{ background: C.brand, color: "#fff" }}>確認寫入</button>
            </div>
          </div>
          <ul className="mt-3 text-xs grid gap-1" style={{ maxHeight: 200, overflowY: "auto" }}>
            {preview.map((r) => (
              <li key={r.day} className="tnum flex gap-3">
                <span style={{ minWidth: "6rem" }}>{r.day}</span>
                <span style={{ color: r.kind === "假日" ? C.brand : C.sub, minWidth: "3rem" }}>{r.kind}</span>
                <span style={{ color: C.sub }}>{r.note}</span>
              </li>
            ))}
          </ul>
        </div>
      )}

      <div className="rounded" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <div className="px-4 py-3 flex items-baseline justify-between"
          style={{ borderBottom: `1px solid ${C.line}` }}>
          <h2 className="font-semibold">目前的定義</h2>
          <span className="text-xs tnum" style={{ color: C.sub }}>
            共 {cal.length} 天・假日 {holi}
          </span>
        </div>
        {cal.length === 0 ? (
          <p className="p-4 text-sm" style={{ color: C.sub }}>
            還沒有任何定義。沒定義的日期一律用週末判斷：週六日算假日，週一到五算平日。
          </p>
        ) : (
          <ul className="text-sm">
            {cal.map((r) => (
              <li key={r.day} className="px-4 py-2 flex items-center gap-3"
                style={{ borderBottom: `1px solid ${C.line}` }}>
                <span className="tnum" style={{ minWidth: "6.5rem" }}>{r.day}</span>
                <span className="text-xs px-2 py-0.5 rounded"
                  style={r.kind === "假日"
                    ? { background: C.badBg, color: C.badText }
                    : { background: C.paper, color: C.sub }}>{r.kind}</span>
                <span className="text-xs" style={{ color: C.sub }}>{r.note}</span>
                <button onClick={() => onDelete(r.day)}
                  className="ml-auto px-2 py-1 text-xs rounded" style={{ color: C.badText }}>刪除</button>
              </li>
            ))}
          </ul>
        )}
      </div>
    </>
  );
}

/* ----------------------------------------------------------------- 匯出 */
function ExportView({ orders, say }) {
  const [busy, setBusy] = useState(false);

  const rows = orders.map((o) => ({
    單號: o.單號 || "",
    客戶ID: o.客戶ID, 單位: o.單位,
    業務歸屬: o.業務歸屬 || "", 負責窗口: o.負責窗口 || "",
    客群: o.客群, 聯絡人: o.聯絡人, 電話: o.電話,
    預定日期: o.日期, 日別: isHoliday(o.日期) ? "假日" : "平日",
    場次: o.包場 ? "包場-" + (o.場次 === "全" ? "整天" : o.場次 + "半場")
                 : (o.場次 === "全" ? "整天" : o.場次 + "半場"),
    場次時間: sessionTime(o.日期, o.場次),
    包場: o.包場 ? "Y" : "N",
    全票: o.全票, 半票: o.半票, 免票: o.免票, 愛心票: o.愛心, 總人數: headcount(o),
    餐飲數量: o.餐飲 || 0,
    劇院數量: o.劇院 || 0,
    派對廳數量: o.PR廳數 || 0,
    派對方案: o.PR方案 || "",
    狀態: isExpired(o) ? "逾期未處理" : o.狀態,
    建立日: o.建立, 保留到期: o.到期 || "", 佔用名額: occupies(o) ? "是" : "否",
    備註: o.備註,
  }));

  const daily = useMemo(() => {
    const set = [...new Set(orders.map((o) => o.日期))].sort();
    return set.map((d) => {
      const s = dayStats(orders, d);
      return {
        日期: d, 日別: isHoliday(d) ? "假日" : "平日",
        當日包場: s.buyout ? "Y" : "N",
        上半場可售: s.buyout ? 0 : s.am,
        下半場可售: s.buyout ? 0 : s.pm,
        整天可售: s.buyout ? 0 : s.full,
        佔名額筆數: s.eff.length,
      };
    });
  }, [orders]);

  const download = async () => {
    setBusy(true);
    try {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "預訂名單");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(daily), "每日現況");
      XLSX.writeFile(wb, `團體預訂_${todayISO()}.xlsx`);
      say("已匯出 Excel");
    } catch (e) {
      say("這個環境擋下了下載，請改用複製表格");
    }
    setBusy(false);
  };

  const copy = async () => {
    const head = Object.keys(rows[0] || {});
    const tsv = [head.join("\t"), ...rows.map((r) => head.map((h) => r[h]).join("\t"))].join("\n");
    try { await navigator.clipboard.writeText(tsv); say("已複製，貼進 Excel 就是完整表格"); }
    catch (e) { say("複製失敗，請手動選取"); }
  };

  if (!orders.length) {
    return <p className="text-sm" style={{ color: C.sub }}>還沒有資料可以匯出。</p>;
  }

  return (
    <>
      <div className="flex gap-2 mb-4 flex-wrap">
        <button onClick={download} disabled={busy} className="px-4 py-2 text-sm rounded"
          style={{ background: C.brand, color: "#fff" }}>
          {busy ? "產生中…" : "下載 Excel"}
        </button>
        <button onClick={copy} className="px-4 py-2 text-sm rounded"
          style={{ border: `1px solid ${C.line}` }}>複製表格</button>
      </div>
      <p className="text-xs mb-3" style={{ color: C.sub }}>
        兩個分頁：預訂名單是逐筆明細，每日現況是名額結果。欄位對齊行事曆主檔，之後要接營運部票務系統，
        照他們的匯入規格改欄名就好。
      </p>

      <div className="overflow-x-auto rounded" style={{ border: `1px solid ${C.line}`, background: C.card }}>
        <table className="text-xs" style={{ borderCollapse: "collapse", minWidth: "100%" }}>
          <thead>
            <tr>
              {Object.keys(rows[0]).map((h) => (
                <th key={h} className="px-2 py-1.5 text-left whitespace-nowrap"
                  style={{ borderBottom: `1px solid ${C.line}`, color: C.sub, fontWeight: 600 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                {Object.keys(rows[0]).map((h) => (
                  <td key={h} className="px-2 py-1.5 whitespace-nowrap tnum"
                    style={{ borderBottom: `1px solid ${C.line}` }}>{String(r[h] ?? "")}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}
