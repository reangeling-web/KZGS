/** 營業時間內每半小時一格 */
function timeMarks(dateStr, { from, to } = {}) {
  const [o, c] = openHours(dateStr);
  const lo = from !== undefined ? from : toMin(o);
  const hi = to !== undefined ? to : toMin(c);
  const out = [];
  for (let m = lo; m <= hi; m += PR_STEP) out.push(toHHMM(m));
  return out;
}
const prStartOptions = (d) => timeMarks(d, { to: toMin(openHours(d)[1]) - PR_STEP });

/** 某個時間點上，已佔用幾廳 */
function prUsedAt(list, minute) {
  return list.reduce((a, o) => {
    const st = toMin(o.PR開始), en = toMin(o.PR結束 || o.PR開始);
    return a + (minute >= st && minute < en ? (+o.PR廳數 || 0) : 0);
  }, 0);
}

/** 新單放進去之後，這段區間內最高會同時用到幾廳 */
function prPeak(list, start, end, qty) {
  const st = toMin(start), en = toMin(end);
  const points = [st, ...list.map((o) => toMin(o.PR開始)).filter((pt) => pt > st && pt < en)];
  return Math.max(...points.map((pt) => prUsedAt(list, pt) + qty));
}

const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());

function isHoliday(dateStr) {
  if (CAL[dateStr]) return CAL[dateStr] === "假日";
  const d = parse(dateStr);
  return d.getDay() === 0 || d.getDay() === 6;
}

/** 平日 09:00-20:00、假日 10:00-21:00，各拆成 5H ／ 1H 清場 ／ 5H */
function sessionTime(dateStr, slot) {
  const hol = isHoliday(dateStr);
  if (slot === "上") return hol ? "10:00–15:00" : "09:00–14:00";
  if (slot === "下") return hol ? "16:00–21:00" : "15:00–20:00";
  return hol ? "10:00–21:00" : "09:00–20:00";
}
function daysBetween(a, b) {
  return Math.round((parse(b) - parse(a)) / 86400000);
}
function addDays(dateStr, n) {
  const d = parse(dateStr); d.setDate(d.getDate() + n); return iso(d);
}
/** 單號：KZ＋年月日時分＋兩碼順序。同一分鐘內的第幾筆就是尾碼。 */
function makeOrderNo(taken) {
  const d = new Date();
  const stem = "KZ" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
             + pad(d.getHours()) + pad(d.getMinutes());
  let i = 1;
  while (taken.has(stem + pad(i))) i++;
  return stem + pad(i);
}

const headcount = (o) => (+o.全票 || 0) + (+o.半票 || 0) + (+o.免票 || 0) + (+o.愛心 || 0);

  已到訪: "到訪於", 已結案: "結案於", 流失: "流失於",

};
/** 單號前 10 碼就是登記日期：KZ20260909… */
function dateFromOrderNo(no) {
  const m = /^KZ(\d{4})(\d{2})(\d{2})/.exec(no || "");
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

/** 這個階段是哪一天開始的：階段紀錄 → 建立日 → 單號 */
function stageStart(o) {
  const at = (o.階段 || {})[o.狀態];
  if (at) return at;
  if (o.狀態 === "檔期暫留") return o.建立 || dateFromOrderNo(o.單號);
  return null;
}

function stageLabel(o) {
  if (o.狀態 === "行前作業")
    return o.日期 ? `活動倒數 ${Math.max(0, daysBetween(todayISO(), o.日期))} 日` : "行前作業";
  const at = stageStart(o);
  if (!at) return STAGE_WORD[o.狀態] || o.狀態;
  if (["已到訪", "已結案", "流失"].includes(o.狀態)) return `${STAGE_WORD[o.狀態]} ${at}`;
  return `${STAGE_WORD[o.狀態] || o.狀態} ${daysBetween(at, todayISO()) + 1} 日`;
}

/* ------------------------------------------------- 名額計算：包場優先 */
/** 這些單裡面已收佔預定的比例。都沒有金額時回 0，線就全是虛的。 */
function payRatio(eff, slots) {
  const rows = eff.filter((o) => slots.includes(o.場次));
  const rev = rows.reduce((a, o) => a + (+o.預估營收 || 0), 0);
  if (rev <= 0) return 0;
  return Math.min(1, rows.reduce((a, o) => a + paidAmount(payRows(o)), 0) / rev);
}

function dayStats(orders, dateStr, excludeId) {
  const eff = orders.filter(
    (o) => o.日期 === dateStr && o.id !== excludeId && occupies(o)
  );
  const amLock = eff.find((o) => o.包場 && (o.場次 === "上" || o.場次 === "全")) || null;
  const pmLock = eff.find((o) => o.包場 && (o.場次 === "下" || o.場次 === "全")) || null;
  const buyout = amLock && pmLock ? amLock : null;   // 兩場都鎖才算整天包場
  const sum = (slots, key) =>
    eff.filter((o) => slots.includes(o.場次))
       .reduce((a, o) => a + (key === "child" ? +o.全票 || 0 : headcount(o)), 0);

  const amChild = sum(["上", "全"], "child"), amAll = sum(["上", "全"], "all");
  const pmChild = sum(["下", "全"], "child"), pmAll = sum(["下", "全"], "all");
  const left = (child, all) =>
    Math.max(0, Math.min(CAP_CHILD - child, CAP_TOTAL - all));

  /* 平日不清場，上半場的人可能還在館內，所以整天共用同一個名額池。
     假日強迫清場，上下半場各自獨立計算。 */
  const pooled = !isHoliday(dateStr);
  const dayChild = eff.reduce((a, o) => a + (+o.全票 || 0), 0);
  const dayAll = eff.reduce((a, o) => a + headcount(o), 0);

  const rest = pooled ? left(dayChild, dayAll) : null;
  const am = pooled ? rest : left(amChild, amAll);
  const pm = pooled ? rest : left(pmChild, pmAll);
  const ratio = Math.min(1, dayChild / CAP_CHILD);

  return {
    buyout, amLock, pmLock, eff, pooled,
    am: amLock ? 0 : am,
    pm: pmLock ? 0 : pm,
    full: amLock || pmLock ? 0 : (pooled ? rest : Math.min(am, pm)),
    amChild, pmChild, amAll, pmAll,
    amOther: amAll - amChild, pmOther: pmAll - pmChild,
    dayChild, dayAll,
    peak: pooled ? dayAll : Math.max(amAll, pmAll),
    /* 實虛線用：各場次已收佔預定的比例，決定那條線有多少比例是實線 */
    amPaidRatio: payRatio(eff, ["上", "全"]),
    pmPaidRatio: payRatio(eff, ["下", "全"]),
    amRatio: pooled ? ratio : Math.min(1, amChild / CAP_CHILD),
    pmRatio: pooled ? ratio : Math.min(1, pmChild / CAP_CHILD),
  };
}

const saveRow = async (t, row) => {
  const { id, ...rest } = row;
  return id
    ? sb.from(t).update(rest).eq("id", id)
    : sb.from(t).insert(rest);
};

/** 業務歸屬分成群組與名稱，用半形直線分隔，例如 Group|PP年度採購。
 *  沒有直線的（舊資料或自己打的）當成沒有群組。 */
const ASSIGN_SEP = "|";
/** Group|PP年度採購 → 群組 Group、線 PP年度採購
 *  Family            → 群組 Family、沒有線（散客底下不分線） */
const assignGroup = (x) => {
  const v = String(x || ""), i = v.indexOf(ASSIGN_SEP);
  return i < 0 ? v : v.slice(0, i);
};
const assignLabel = (x) => {
  const v = String(x || ""), i = v.indexOf(ASSIGN_SEP);
  return i < 0 ? "" : v.slice(i + 1);
};
/** 畫面上要顯示的字：有線就顯示線，沒線就顯示群組 */
const assignText = (x) => assignLabel(x) || assignGroup(x);
/** 這些資料裡有哪些群組，保持原本的排序 */
const assignGroups = (rows) =>
  [...new Set(rows.map((a) => assignGroup(a.name)).filter(Boolean))];
/** 某個群組底下的線。沒有線的群組（例如 Family）回空陣列。 */
const assignLines = (rows, g) =>
  rows.filter((a) => assignGroup(a.name) === g && assignLabel(a.name));
/** 依群組分堆，保持原本的排序 */
const groupAssigns = (rows) => {
  const out = [];
  for (const a of rows) {
    const g = assignGroup(a.name);
    let bucket = out.find((x) => x.g === g);
    if (!bucket) { bucket = { g, items: [] }; out.push(bucket); }
    bucket.items.push(a);
  }
  return out;
};

/** 兩層的業務歸屬選單。群組底下沒有線的話（散客）就只出現一層。 */
function AssignPicker({ assigns = [], value, onChange, allowEmpty }) {
  const groups = assignGroups(assigns);
  const [held, setHeld] = useState("");          // 還沒選到線時，先記住選了哪個群組
  const g = value ? assignGroup(value) : held;
  const lines = g ? assignLines(assigns, g) : [];

  const pickGroup = (ng) => {
    setHeld(ng);
    const ls = ng ? assignLines(assigns, ng) : [];
    /* 沒有第二層就直接定案，有第二層先清空等使用者選 */
    onChange(ls.length ? "" : ng);
  };

  return (
    <>
      <Field label="歸屬群組">
        <select value={g} style={inp} onChange={(e) => pickGroup(e.target.value)}>
          <option value="">{allowEmpty ? "未指定" : "請選擇"}</option>
          {groups.map((x) => <option key={x}>{x}</option>)}
        </select>
      </Field>
      {lines.length > 0 && (
        <Field label="業務歸屬">
          <select value={value} style={inp} onChange={(e) => onChange(e.target.value)}>
            <option value="">請選擇</option>
            {lines.map((a) => (
              <option key={a.id} value={a.name}>{assignLabel(a.name)}</option>
            ))}
          </select>
        </Field>
      )}
    </>
  );
}

/** 報價時這個業務看得到哪些產品：沒設業務歸屬的大家都看得到，有設的只有被標到的人看得到 */
const repTags = (rep) => (Array.isArray(rep && rep.tags) ? rep.tags : []);
function productsForRep(products, rep, kind) {
  const tags = repTags(rep);
  return products.filter((p) =>
    p.active !== false &&
    (!kind || p.kind === kind) &&
    (!p.assignment || tags.includes(p.assignment)));
}

function CustomersView({ rows, onSave, say, me }) {
  const [q, setQ] = useState("");
  const [edit, setEdit] = useState(null);
  const [busy, setBusy] = useState(false);
  const list = rows.filter((r) => match([r.org, r.tax_id, r.contact, r.phone, r.mobile, r.email], q));

  const save = async () => {
    if (!edit.org.trim()) return say("填一下單位名稱");
    const dupe = rows.find((r) => r.id !== edit.id &&
      (r.org.trim() === edit.org.trim() || (edit.tax_id && r.tax_id === edit.tax_id)));
    if (dupe && !edit._confirmed) {
      setEdit({ ...edit, _confirmed: true });
      return say(`已有「${dupe.org}」單位名稱或統編相同，確定要新增就再按一次儲存`);
    }
    setBusy(true);
    const { _confirmed, ...row } = edit;
    const { error } = await saveRow("customers",
      row.id ? { ...row, updated_at: new Date().toISOString() }
             : { ...row, created_by: me?.name || "" });
    setBusy(false);
    if (error) return say(clean(error.message));
    setEdit(null); say("已儲存"); onSave();
  };

  return (
    <MasterShell title="客戶建檔" q={q} setQ={setQ} addLabel="新增客戶"
      hint="建過一次之後，登記需求和報價時就能直接下拉選取，資料自動帶入。"
      onAdd={() => setEdit(blankCustomer())}>
      <ul className="grid gap-2">
        {list.map((r) => (
          <RowCard key={r.id} dim={!r.active}>
            <div className="flex justify-between gap-3 flex-wrap">
              <div>
                <div className="font-medium">{r.org}</div>
                <div className="text-xs mt-0.5 tnum" style={{ color: C.sub }}>
                  {r.segment}{r.tax_id && `　統編 ${r.tax_id}`}
                  {r.contact && `　${r.contact}`}{r.phone && `　${r.phone}`}{r.mobile && `　${r.mobile}`}
                </div>
              </div>
              <button onClick={() => setEdit({ ...r })} className="px-2.5 py-1 text-xs rounded h-fit"
                style={{ border: `1px solid ${C.line}` }}>編輯</button>
            </div>
          </RowCard>
        ))}
        {list.length === 0 && <p className="text-sm" style={{ color: C.sub }}>沒有符合的資料。</p>}
      </ul>

      {edit && (
        <Modal title={edit.id ? "編輯客戶" : "新增客戶"} busy={busy} wide
          onClose={() => setEdit(null)} onSave={save}>
          <CustomerForm edit={edit} setEdit={setEdit} />
        </Modal>
      )}
    </MasterShell>
  );
}

/* ===================================================== 產品建檔 */
/** 四大類：票務／活動（人種）／餐飲／專案。一個專案在報價單上就是一列，不拆開。 */
const PRODUCT_KINDS = ["票務", "活動", "餐飲", "專案", "其他"];
const UNIT_OF = { 票務: "張", 活動: "位", 餐飲: "份", 專案: "式", 其他: "個" };

/** 逾期兌換手續費只有票務類有：一般票券固定 70 元、墨攻為面額的 10% */
const LATE_FEES = [["", "無"], ["fixed", "固定金額"], ["percent", "面額百分比"]];
const lateFeeText = (r) =>
  r.late_fee_kind === "fixed" ? `逾期 +${money(r.late_fee_value)} 元`
    : r.late_fee_kind === "percent" ? `逾期 +${r.late_fee_value}%` : "";

const blankProduct = (kind) => ({
  kind, category: kind === "活動" ? "票種" : "", assignment: "", name: "", alias: "",
  subtitle: "", doc_title: "", list_price: 0, price: 0, unit: UNIT_OF[kind] || "式",
  min_qty: 0, remark: "", terms: "", payment_rule: kind === "票務" ? "ticket" : "activity",
  late_fee_kind: "", late_fee_value: 0,
  active: true, sort: 0,
});

    .filter((r) => match([r.name, r.alias, r.assignment, r.category, r.kind], q));

  const save = async () => {
    if (!edit.name.trim()) return say("填一下產品名稱");

    const { error } = await saveRow("products",
      { ...edit, updated_at: new Date().toISOString() });

    if (error) return say(clean(error.message));

  /** 複製一份當新產品的起點：內容全帶，名稱加「副本」，存檔前可以改 */
  const copyProduct = (r) => {
    const { id, created_at, updated_at, ...rest } = r;
    let name = `${r.name} 副本`;
    for (let i = 2; rows.some((x) => x.name === name); i++) name = `${r.name} 副本 ${i}`;

                  late_fee_value: v === "票務" ? edit.late_fee_value : 0,

                {PRODUCT_KINDS.map((x) => <option key={x}>{x}</option>)}

          </Field>
          <Field label="產品說明（印在名稱下方）" wide>
            <textarea rows={2} value={edit.subtitle} style={inp} onChange={f("subtitle")} />

/* ------------------------------------------------------------------ App */
function App() {
  const [session, setSession] = useState(undefined);   // undefined = 還在確認
  const [orders, setOrders] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("首頁");
  const [cursor, setCursor] = useState({ y: 2026, m: 12 });
  const [picked, setPicked] = useState(null);
  const [formOpen, setFormOpen] = useState(false);
  const [formKind, setFormKind] = useState("活動");   // 新單是票務、活動還是外訪
  const [sheet, setSheet] = useState("出訪單");       // 2 樓現在在哪一張單
  const [sheetEdit, setSheetEdit] = useState(null);  // 表單頁正在改哪一筆
  const [editing, setEditing] = useState(null);
  const [lastNo, setLastNo] = useState(null);
  const [toast, setToast] = useState(null);

  const say = (m) => { setToast(m); setTimeout(() => setToast(null), 3200); };
  const [guestMode, setGuestMode] = useState(false);
  const [cal, setCal] = useState([]);
  const [reps, setReps] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [products, setProducts] = useState([]);
  const [assigns, setAssigns] = useState([]);
  const [masterLoaded, setMasterLoaded] = useState(false);
  const guest = !session;
  const admin = !guest;
  const signedIn = !!session;
  useEffect(() => { setTab(signedIn ? "首頁" : "檔期"); }, [signedIn]);

  const loadCal = async () => {
    const { data } = await sb.from("calendar_days").select("*").order("day");
    const m = {}, n = {};
    for (const r of data || []) { m[r.day] = r.kind; n[r.day] = r.note || ""; }
    setCalendarMap(m); CAL_NOTE = n; setCal(data || []);
  };
  useEffect(() => { loadCal(); }, []);

  /* 建檔資料：業務、客戶、產品、業務歸屬 */
  const loadMaster = async () => {
    const [r, c, pr, a] = await Promise.all([
      loadTable("sales_reps", "sort"),
      loadTable("customers", "org"),
      loadTable("products", "sort"),
      loadTable("assignments", "sort"),
    ]);
    setReps(r); setCustomers(c); setProducts(pr); setAssigns(a);
    setLists("reps", r); setLists("customers", c);
    setLists("products", pr); setLists("assignments", a);
    setMasterLoaded(true);
  };
  useEffect(() => { if (session) loadMaster(); }, [session]);

  const me = session
    ? reps.find((r) => (r.email || "").toLowerCase() === (session.user.email || "").toLowerCase())
    : null;
  /* 還沒登記在業務建檔的帳號只能看檔期 */
  const registered = !masterLoaded || !!me;
  const myTabs = registered ? TABS : ["檔期"];

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  /* 訪客：只讀彙總檢視，讀不到任何一筆原始資料 */
  useEffect(() => {
    if (!guestMode || session) return;
    (async () => {
      const { data } = await sb.from("availability").select("*");
      setOrders((data || []).map(toGuest)); setLoaded(true);
    })();
  }, [guestMode, session]);

  /* 已登入：讀完整名單，並開啟即時同步 */
  const reload = async () => {
    const { data, error } = await sb.from("bookings").select("*").order("visit_date");
    if (error) { say("讀取失敗：" + error.message); return; }
    setOrders((data || []).map(toApp));
    setLoaded(true);
  };

  useEffect(() => {
    if (!session) return;
    reload();
    const ch = sb.channel("bookings-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, reload)
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [session]);

  const getDay = (date) => dayStats(orders, date);

  const addOrder = async (o) => {
    const created = todayISO();
    const first = o.類別 === "外訪" ? "籌備中" : "檔期暫留";
    const rec = {
      ...o,
      單號: makeOrderNo(new Set(orders.map((x) => x.單號))),
      客戶ID: "",
      狀態: first,
      建立: created,
      階段: { [first]: created },
    };
    /* 票務單沒有檔期，日期與場次要存成空，由 toDb 轉成 null */
    if (rec.類別 === "票務") { rec.日期 = ""; rec.場次 = ""; }
    if (rec.類別 === "外訪") rec.場次 = "";
    const { data, error } = await sb.from("bookings").insert(toDb(rec)).select().single();
    if (error) { say(clean(error.message)); return null; }
    setFormOpen(false); setPicked(o.日期 || null); setLastNo(rec.單號);
    await reload();
    if (data) return toApp(data);
    /* 保險：insert 沒把新那筆回傳回來時，用單號再撈一次 */
    const { data: again } = await sb.from("bookings")
      .select("*").eq("order_no", rec.單號).maybeSingle();
    return again ? toApp(again) : null;
  };

  const patch = async (id, fields) => {
    const { error } = await sb.from("bookings").update(fields).eq("id", id);
    if (error) { say(clean(error.message)); return false; }
    await reload();
    return true;
  };

  const setField = (id, key, val) => patch(id, toDb({ [key]: val }));

  const updateOrder = async (o) => {
    if (await patch(o.id, toDb(o))) { setEditing(null); say("已更新，名額同步重算"); }
  };

  const move = async (id, status) => {
    const o = orders.find((x) => x.id === id);
    const log = { ...(o.階段 || {}) };
    if (!log[status]) log[status] = todayISO();      // 第一次進入該階段才記，重複推進不覆蓋
    await patch(id, { status, stage_log: log });
  };

  const saveCal = async (rows) => {
    const { error } = await sb.from("calendar_days").upsert(rows, { onConflict: "day" });
    if (error) { say(clean(error.message)); return false; }
    await loadCal();
    say(`已更新 ${rows.length} 個日期`);
    return true;
  };

  const delCal = async (day) => {
    const { error } = await sb.from("calendar_days").delete().eq("day", day);
    if (error) { say(clean(error.message)); return; }
    await loadCal();
  };

  /** 流失還原：回到檔期暫留，預留天數從今天重新起算 */
  const restore = async (id) => {
    const o = orders.find((x) => x.id === id);
    const log = { ...(o.階段 || {}) };
    delete log["流失"];
    const back = o.類別 === "外訪" ? "籌備中" : "檔期暫留";
    log[back] = todayISO();
    const ok = await patch(id, { status: back, stage_log: log });
    if (ok) say(o.類別 === "外訪" ? "已還原為籌備中" : "已還原為檔期暫留，名額重新佔用");
  };

  const remove = async (id) => {
    const { error } = await sb.from("bookings").delete().eq("id", id);
    if (error) { say(clean(error.message)); return; }
    await reload();
  };

  if (session === undefined) return <Splash text="載入中…" />;
  if (!session && !guestMode) return <LoginPage onGuest={() => setGuestMode(true)} />;

  if (!loaded) return <Splash text="讀取檔期資料…" />;

  return (
    <div className="min-h-screen" style={{ background: C.paper, color: C.ink, fontFamily: FONT }}>
      <style>{CSS}</style>

      <header className="px-4 pt-5 pb-3" style={{ borderBottom: `1px solid ${C.line}` }}>
        <div className="max-w-5xl mx-auto">
          <div className="flex items-baseline justify-between flex-wrap gap-2">

              <h1 className="text-xl font-semibold tracking-tight">
                團體平台
                <span className="ml-2 text-xs font-normal tnum" style={{ color: C.sub }}>{BUILD}</span>
              </h1>
              <p className="text-xs mt-1" style={{ color: C.sub }}>
                {guest
                  ? "預覽權限　可查看檔期與各團人數，不顯示預約單位"
                  : `全票上限 ${CAP_CHILD} 位・同時容留 ${CAP_TOTAL} 位・包場當日不再對外開放`}
              </p>
            </div>
            <nav className="flex gap-1 items-center flex-wrap">
              {(guest ? ["檔期"] : myTabs).map((t) => (
                <button key={t} onClick={() => setTab(t)} className="px-3 py-1.5 text-sm rounded"
                  style={tab === t
                    ? { background: C.brand, color: "#fff" }
                    : { color: C.sub, background: "transparent" }}>
                  {t}
                </button>
              ))}
              {guest ? (
                <button onClick={() => { setGuestMode(false); setLoaded(false); }}
                  className="ml-1 px-3 py-1.5 text-sm rounded"
                  style={{ background: C.brand, color: "#fff" }}>登入</button>
              ) : (
                <>
                  <button onClick={() => setTab("首頁")} className="ml-1 px-2.5 py-1.5 text-xs rounded"
                    style={tab === "首頁"
                      ? { border: `1px solid ${C.brand}`, color: C.brand }
                      : { border: `1px solid ${C.line}`, color: C.sub }}>首頁</button>
                  <button onClick={() => sb.auth.signOut()}
                    className="px-2.5 py-1.5 text-xs rounded"
                    style={{ border: `1px solid ${C.line}`, color: C.sub }}>登出</button>
                </>
              )}
            </nav>
          </div>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-5">
        {lastNo && (
          <div className="mb-4 rounded p-4 flex items-center justify-between gap-3 flex-wrap"
            style={{ background: C.card, border: `2px solid ${C.brand}` }}>
            <div>
              <p className="text-xs" style={{ color: C.sub }}>已登記，請記下單號</p>
              <p className="text-xl font-semibold tnum" style={{ color: C.brand }}>{lastNo}</p>
              <p className="text-xs mt-1" style={{ color: C.sub }}>
                報價與收款以這組單號對應，系統不記錄金額。
              </p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => navigator.clipboard?.writeText(lastNo)}
                className="px-3 py-2 text-sm rounded" style={{ border: `1px solid ${C.line}` }}>
                複製
              </button>
              <button onClick={() => setLastNo(null)}
                className="px-3 py-2 text-sm rounded" style={{ background: C.brand, color: "#fff" }}>
                知道了
              </button>
            </div>
          </div>
        )}
        {tab === "首頁" && admin && (
          <HomeView me={me} onGo={(k) => {
            if (k === "新增票務" || k === "新增活動") {
              setFormKind(k === "新增票務" ? "票務" : "活動");
              setPicked(null); setEditing(null); setFormOpen(true); setTab("任務");
            } else if (k.startsWith("表單:")) {
              setSheet(k.slice(3)); setSheetEdit(null); setTab("表單");
            } else setTab(k);
          }} />
        )}
        {tab === "檔期" && (
          <CalendarView
            getDay={getDay} cursor={cursor} setCursor={setCursor}
            picked={picked} setPicked={setPicked} admin={admin} guest={guest}
            onNew={(d) => { setFormKind("活動"); setPicked(d); setFormOpen(true); }}
          />
        )}
        {tab === "任務" && admin && (
          <TaskView orders={orders} onMove={move} onRemove={remove} onEdit={setEditing}
            onField={setField} onRestore={restore}
            onNew={(k) => {
              if (k === "外訪") { setSheet("出訪單"); setSheetEdit(null); setTab("表單"); return; }
              setFormKind(k); setPicked(null); setEditing(null); setFormOpen(true);
            }}
            onSheet={(o) => { setSheet("出訪單"); setSheetEdit(o); setTab("表單"); }} />
        )}
        {tab === "行事曆" && admin && (
          <CalendarAdmin cal={cal} onSave={saveCal} onDelete={delCal} say={say} />
        )}
        {tab === "表單" && admin && registered && (
          <FormsView
            sheet={sheet} setSheet={setSheet}
            orders={orders} customers={customers} reps={reps} assigns={assigns}
            products={products} me={me} say={say}
            editing={sheetEdit} setEditing={setSheetEdit}
            onSubmit={async (o) => {
              if (sheetEdit) {
                await updateOrder({ ...sheetEdit, ...o });
                say("已儲存，下面的出訪單同步更新");
              } else {
                const rec = await addOrder(o);
                if (rec) setSheetEdit(rec);
              }
            }}
            onSaveAsNew={async (o) => {
              const { id, 單號, 階段, 建立, ...rest } = o;
              const rec = await addOrder({ ...rest, 類別: "外訪" });
              if (rec) { setSheetEdit(rec); say("已另存為新的一場"); }
            }} />
        )}
        {tab === "匯出" && admin && <ExportView orders={orders} say={say} />}

        {tab === "業務建檔" && admin && registered && (
          <RepsView rows={reps} assignments={assigns} onSave={loadMaster} say={say} />

        {tab === "客戶建檔" && admin && registered && (
          <CustomersView rows={customers} onSave={loadMaster} say={say} me={me} />
        )}
        {tab === "產品建檔" && admin && registered && (
          <ProductsView rows={products} assignments={assigns} onSave={loadMaster} say={say} />
        )}

        {(formOpen || editing) && (
          <RequestForm
            date={picked} orders={orders} editing={editing} kind={formKind}
            customers={customers} reps={reps} assigns={assigns} products={products} me={me}

/* ------------------------------------------------------------ 檔期預覽 */
function CalendarView({ getDay, cursor, setCursor, picked, setPicked, onNew, admin, guest }) {
  const { y, m } = cursor;
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const lead = first.getDay();

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++) cells.push(iso(new Date(y, m - 1, d)));
  while (cells.length % 7) cells.push(null);

  const step = (n) => {
    let mm = m + n, yy = y;
    if (mm > 12) { mm = 1; yy++; } if (mm < 1) { mm = 12; yy--; }
    setCursor({ y: yy, m: mm }); setPicked(null);
  };

  return (
    <>
      <div className="flex items-center justify-between mb-2 flex-wrap gap-y-2">
        <div className="flex items-center gap-3">
          <button onClick={() => step(-1)} className="w-8 h-8 rounded text-lg leading-none"
            style={{ border: `1px solid ${C.line}`, background: C.card }} aria-label="上個月">‹</button>
          <div className="text-lg font-semibold tnum" style={{ minWidth: "7.5rem" }}>
            {y} 年 {m} 月
          </div>
          <button onClick={() => step(1)} className="w-8 h-8 rounded text-lg leading-none"
            style={{ border: `1px solid ${C.line}`, background: C.card }} aria-label="下個月">›</button>
        </div>
        <div className="flex items-center gap-3 text-xs flex-wrap" style={{ color: C.sub }}>
          <Legend color={C.okBar} label="可售" />
          <Legend color={C.warnBar} label="吃緊" />
          <Legend color={C.badBar} label="不可售" />
          <span style={{ width: 1, height: 12, background: C.line }} />
          <LegendLine label="已付訂" />
          <LegendLine dashed label="僅預定" />
        </div>
      </div>
      <p className="text-xs mb-3" style={{ color: C.sub }}>
        顏色看名額鬆不鬆，實虛看錢進來了沒。紅色但整條虛線代表帳面滿了卻一毛沒收，
        橘色但整條實線才是真的被吃掉。
      </p>

      <div className="grid grid-cols-7 gap-px rounded overflow-hidden"
        style={{ background: C.line, border: `1px solid ${C.line}` }}>
        {["日", "一", "二", "三", "四", "五", "六"].map((w) => (
          <div key={w} className="text-center text-xs py-1.5"
            style={{ background: C.card, color: C.sub }}>{w}</div>
        ))}
        {cells.map((d, i) =>
          d === null
            ? <div key={i} style={{ background: C.paper, minHeight: 76 }} />
            : <DayCell key={d} date={d} s={getDay(d)}
                selected={picked === d} onClick={() => setPicked(picked === d ? null : d)} />
        )}
      </div>

      {picked
        ? <DayPanel date={picked} s={getDay(picked)} onNew={onNew} admin={admin} guest={guest} />
        : <p className="text-sm mt-4" style={{ color: C.sub }}>
            點一個日期看細節，或直接登記需求。
          </p>}
    </>
  );
}

function Legend({ color, label }) {
  return (
    <span className="flex items-center gap-1.5">
      <span style={{ display: "block", width: 18, height: 4, borderRadius: 2, background: color }} />
      {label}
    </span>
  );
}

function LegendLine({ dashed, label }) {
  return (
    <span className="flex items-center gap-1.5">
      <span style={dashed
        ? { display: "block", width: 18, height: 0, borderTop: `3px dashed ${C.sub}` }
        : { display: "block", width: 18, height: 4, borderRadius: 2, background: C.sub }} />
      {label}
    </span>

}

function DayCell({ date, s, selected, onClick }) {
  const d = parse(date);
  const hol = isHoliday(date);
  const bo = !!(s.amLock && s.pmLock);

  return (
    <button onClick={onClick} className="text-left p-1.5 flex flex-col gap-1"
      style={{
        background: bo ? C.badBg : C.card,
        minHeight: 76,
        boxShadow: selected ? `inset 0 0 0 2px ${C.brand}` : "none",
      }}>
      <span className="text-xs tnum" style={{ color: hol ? C.brand : C.sub, fontWeight: hol ? 600 : 400 }}>
        {d.getDate()}
      </span>

      {bo ? (
        <>
          <span className="text-xs font-semibold mt-1" style={{ color: C.badText }}>包場</span>
          <Bar ratio={1} left={0} paid={s.amPaidRatio} />
        </>
      ) : (
        <>
          <Bar ratio={s.amLock ? 1 : s.amRatio} left={s.amLock ? 0 : s.am} paid={s.amPaidRatio} />
          <Bar ratio={s.pmLock ? 1 : s.pmRatio} left={s.pmLock ? 0 : s.pm} paid={s.pmPaidRatio} />
          <span className="text-xs tnum mt-auto"
            style={{ color: s.amLock || s.pmLock ? C.badText : TONE[toneOf(s.full)].t }}>
            {s.amLock ? "上包場" : s.pmLock ? "下包場"
              : s.full <= 0 ? "額滿" : s.peak > 0 ? `已訂 ${s.peak}` : ""}
          </span>
        </>
      )}
    </button>
  );
}

/** 上下半場各一條，滿格代表全票 700 用完。
 *  顏色＝名額鬆緊；實線的那一段＝已收的比例，剩下的畫虛線。 */
function Bar({ ratio, left, paid = 0 }) {
  const tone = TONE[toneOf(left)];
  const w = Math.max(ratio * 100, ratio > 0 ? 6 : 0);
  const solid = Math.min(1, Math.max(0, paid));
  return (
    <span style={{ display: "block", height: 4, background: C.line, borderRadius: 2 }}>
      <span style={{ display: "flex", height: 4, width: `${w}%`, borderRadius: 2,
        overflow: "hidden" }}>
        {solid > 0 && (
          <span style={{ display: "block", height: 4, width: `${solid * 100}%`,
            background: tone.bar, borderRadius: 2 }} />
        )}
        {solid < 1 && (
          <span style={{ display: "block", height: 0, width: `${(1 - solid) * 100}%`,
            marginTop: 1, borderTop: `3px dashed ${tone.bar}` }} />
        )}
      </span>
    </span>
  );
}

function DayPanel({ date, s, onNew, admin, guest }) {
  const d = parse(date);
  const wk = "日一二三四五六"[d.getDay()];
  const hol = isHoliday(date);

  return (
    <section className="mt-4 rounded p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2 mb-3">
        <h2 className="font-semibold tnum">
          {date}（{wk}）
          <span className="ml-2 text-xs font-normal" style={{ color: hol ? C.brand : C.sub }}>
            {hol ? "假日" : "平日"}
          </span>
        </h2>
        {!guest && (
          <button onClick={() => onNew(date)} className="px-3 py-1.5 text-sm rounded"
            style={{ background: C.brand, color: "#fff" }}>
            登記需求
          </button>
        )}
      </div>

      {s.amLock && s.pmLock ? (
        <div className="rounded p-3 text-sm" style={{ background: C.badBg, color: C.badText }}>
          <strong>當日已包場</strong>，不再對外開放，上下半場一律不可售。
          {!guest && s.buyout.單位 && (
            <div className="mt-1" style={{ color: C.ink }}>
              {s.buyout.單位}・{s.buyout.場次 === "全" ? "全場" : s.buyout.場次 + "半場"}・{s.buyout.狀態}
            </div>
          )}
        </div>
      ) : (
        <>
        <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))" }}>
          <Slot name="上半場" time={sessionTime(date, "上")} left={s.am}
            booked={s.amAll} child={s.amChild} other={s.amOther}
            lock={s.amLock} guest={guest} />
          <Slot name="下半場" time={sessionTime(date, "下")} left={s.pm}
            booked={s.pmAll} child={s.pmChild} other={s.pmOther}
            lock={s.pmLock} guest={guest} />
          {!hol && !s.amLock && !s.pmLock && (
            <Slot name="全場" time={sessionTime(date, "全")} left={s.full}
              booked={s.dayAll} child={s.dayChild} other={s.dayAll - s.dayChild}
              note="同時佔用上下半場" />
          )}
        </div>
        <p className="text-xs mt-2" style={{ color: C.sub }}>
          {hol
            ? "假日兩場之間強迫清場，整天僅開放包場。上下半場各自售滿才是當日上限。"
            : `平日不清場，上下半場共用名額池。當日已訂 ${s.dayAll} 人（全票 ${s.dayChild}），整日上限 ${CAP_TOTAL} 人、全票 ${CAP_CHILD}。`}
        </p>
        {!hol && s.dayAll > 0 && (
          <p className="text-xs mt-1 tnum" style={{ color: C.sub }}>
            團體保守值取上半場不離場計算。若上半場全數離場，下半場現場最多可再收
            <span style={{ color: C.brand, fontWeight: 600 }}>{" "}{Math.max(0, Math.min(CAP_CHILD - s.pmChild, CAP_TOTAL - s.pmAll))}{" "}</span>
            人。
          </p>
        )}
        </>
      )}

      {!guest && (
        <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
          <p className="text-xs mb-2" style={{ color: C.sub }}>
            派對廳佔用　實體 {PR_ROOMS_AT_ONCE} 廳。數字是該小時內同時佔用的廳數
          </p>
          <div className="flex gap-px flex-wrap">
            {(() => {
              const list = s.eff.filter((o) => o.PR廳數 > 0 && o.PR開始 && o.PR結束);
              const [op, cl] = openHours(date);
              const cells = [];
              for (let m = toMin(op); m < toMin(cl); m += 60) {
                const used = Math.max(prUsedAt(list, m), prUsedAt(list, m + 30));
                const tone = used >= PR_ROOMS_AT_ONCE ? TONE.bad : used > 0 ? TONE.warn : TONE.ok;
                cells.push(
                  <div key={m} className="rounded tnum text-center"
                    style={{ background: tone.b, color: tone.t, minWidth: 46, padding: "4px 2px" }}>
                    <div style={{ fontSize: 10 }}>{toHHMM(m).slice(0, 2)}</div>
                    <div style={{ fontSize: 11, fontWeight: 600 }}>{used}</div>
                  </div>
                );
              }
              return cells;
            })()}
          </div>
          {s.eff.filter((o) => o.PR廳數 > 0 && o.PR開始).length > 0 && (
            <ul className="mt-2 text-xs tnum" style={{ color: C.sub }}>
              {s.eff.filter((o) => o.PR廳數 > 0 && o.PR開始).map((o) => (
                <li key={o.id}>
                  {o.PR開始}–{o.PR結束}　{o.PR廳數} 廳　{guest ? o.單號 : o.單位}
                </li>
              ))}
            </ul>
          )}
        </div>
      )}

      {s.eff.length > 0 && (
        <ul className="mt-3 text-sm" style={{ borderTop: `1px solid ${C.line}` }}>
          {s.eff.map((o) => (
            <li key={o.id} className="py-2 flex justify-between gap-3 flex-wrap"
              style={{ borderBottom: `1px solid ${C.line}` }}>
              <span className={guest ? "tnum" : ""}>
                {guest ? o.單號 : o.單位}
                <span className="ml-2 text-xs tnum" style={{ color: C.sub }}>
                  {o.場次 === "全" ? "全場" : o.場次 + "半場"}
                  ・{headcount(o)} 人（全票 {o.全票}）
                </span>
              </span>
              {!guest && <span className="text-xs" style={{ color: C.sub }}>{o.狀態}</span>}
            </li>
          ))}
        </ul>
      )}
    </section>
  );
}

function Slot({ name, time, left, booked, child, other, note, lock, guest }) {
  const tone = TONE[toneOf(left)];
  if (lock) {
    return (
      <div className="rounded p-3" style={{ background: C.badBg }}>
        <div className="text-xs" style={{ color: C.badText }}>{name}　{time}</div>
        <div className="text-xl font-semibold mt-1" style={{ color: C.badText }}>已包場</div>
        <div className="text-xs mt-1" style={{ color: C.badText, opacity: .9 }}>
          {guest ? lock.單號 : lock.單位}
        </div>
      </div>
    );
  }
  return (
    <div className="rounded p-3" style={{ background: tone.b }}>
      <div className="text-xs" style={{ color: tone.t }}>{name}　{time}</div>
      <div className="text-2xl font-semibold tnum mt-1" style={{ color: tone.t }}>
        {booked}
        <span className="text-xs font-normal ml-1" style={{ opacity: .8 }}>人已訂</span>
      </div>
      <div className="text-xs mt-1 tnum" style={{ color: tone.t, opacity: .9 }}>
        全票 {child}　其他 {other}
      </div>
      <div className="text-xs mt-2 pt-2 tnum"
        style={{ color: tone.t, borderTop: `1px solid ${tone.t}22` }}>
        {left > 0 ? `尚可售全票 ${left}` : "額滿"}
        {note ? `　${note}` : ""}
      </div>
    </div>
  );
}

/** 一排打勾的多選。value 可以是陣列或頓號字串，回傳一律是陣列。
 *  勾了「其他」會跳出文字欄，內容直接存進那個選項（存成「其他：校內運動會」），
 *  所以出訪單與匯出不必另外處理。 */
const OTHER = "其他";
const OTHER_MAX = 20;
function CheckRow({ label, options, value, onChange, hint, max = OTHER_MAX }) {
  const on = toList(value);
  const isOther = (x) => x === OTHER || x.startsWith(OTHER + "：");
  const otherOn = on.some(isOther);
  const otherText = (on.find(isOther) || "").slice(OTHER.length + 1);

  const flip = (k) => {
    if (k === OTHER) {
      onChange(otherOn ? on.filter((x) => !isOther(x)) : [...on, OTHER]);
      return;
    }
    onChange(on.includes(k) ? on.filter((x) => x !== k) : [...on, k]);
  };
  /* 頓號與逗號是分隔符，讓使用者打進去會把資料拆壞，輸入當下就擋掉 */
  const setOther = (t) => {
    const clean = t.replace(/[、,，]/g, "").slice(0, max);
    onChange(on.map((x) => isOther(x) ? (clean ? `${OTHER}：${clean}` : OTHER) : x));
  };

  const picked = (k) => k === OTHER ? otherOn : on.includes(k);

  return (
    <div>
      {label && <p className="text-xs mb-1" style={{ color: C.sub }}>{label}</p>}
      <div className="flex gap-1.5 flex-wrap items-center">
        {options.map((k) => (
          <button key={k} onClick={() => flip(k)} className="px-2.5 py-1 text-xs rounded"
            style={picked(k) ? { border: `1px solid ${C.brand}`, color: C.brand }
                             : { border: `1px solid ${C.line}`, color: C.sub }}>
            {picked(k) ? "☑" : "☐"} {k}
          </button>
        ))}
        {otherOn && (
          <span className="flex items-center gap-1.5">
            <input value={otherText} onChange={(e) => setOther(e.target.value)}
              maxLength={max} placeholder={`請填寫，${max} 字以內`}
              style={{ ...inp, padding: "4px 8px", fontSize: 12, width: 190 }} />
            <span className="text-xs tnum"
              style={{ color: otherText.length >= max ? C.badText : C.sub }}>
              {otherText.length}/{max}
            </span>
          </span>
        )}
      </div>
      {hint && <p className="text-xs mt-1" style={{ color: C.sub }}>{hint}</p>}
    </div>
  );
}

/** 區塊外框。一定要定義在元件外面，否則每次 render 都是新元件，輸入框會失焦。 */
function Sec({ t, children, right }) {

    </div>
  );
}

  );
}

/* ------------------------------------------------------------ 需求登記 */
function RequestForm({ date, orders, editing, onClose, onSubmit, kind = "活動",
                      customers = [], reps = [], assigns = [], products = [],
                      me, onCustomerSaved, say, inline, onSaveAsNew }) {
  const [newCust, setNewCust] = useState(null);
  const [f, setF] = useState(() => editing
    ? { ...editing, 業務窗口: editing.業務窗口 || editing.負責窗口 || "",
        類別: editing.類別 || "活動", 明細: editing.明細 || [],
        外訪: editing.類別 === "外訪" ? theVisit(editing) : (editing.外訪 || {}),
        收款: payRows(editing).length ? payRows(editing) : [blankPay()] }
    : {
    類別: kind, 明細: kind === "票務" ? [blankItem()] : [],
    外訪: kind === "外訪" ? blankVisit() : {},
    客戶id: "", 單位: "", 客群: "學校", 業務歸屬: "",
    業務窗口: (me && me.name) || "", 聯絡人: "", 電話: "",
    日期: kind === "票務" ? "" : (date || todayISO()),
    包場: false,
    場次: kind === "票務" ? "" : (isHoliday(date || todayISO()) ? "上" : "全"),
    全票: "", 半票: "", 免票: "", 愛心: "",
    餐飲: 0, 劇院: 0, PR廳數: 0, PR開始: "", PR結束: "", PR方案: "",
    收款: [blankPay()], 備註: "",
  });
  const ticket = f.類別 === "票務";
  const visit  = f.類別 === "外訪";
  const setV = (k, val) => setF((p) => ({ ...p, 外訪: { ...theVisit(p), [k]: val } }));
  const set = (k, v) => setF((p) => {
    const n = { ...p, [k]: v };
    if (!n.包場 && n.場次 === "全" && isHoliday(n.日期)) n.場次 = "上";
    if (n.PR開始 && !prStartOptions(n.日期).includes(n.PR開始)) { n.PR開始 = ""; n.PR結束 = ""; }
    if (n.PR結束 && n.PR開始 && toMin(n.PR結束) <= toMin(n.PR開始)) n.PR結束 = "";
    return n;
  });

  /** 選客戶：帶入單位、客群、聯絡人、電話，帶入後仍可自行修改 */
  const pickCustomer = (id) => {
    const c = customers.find((x) => x.id === id);
    setF((p) => {
      if (!c) return { ...p, 客戶id: "" };
      const nx = { ...p, 客戶id: id, 單位: c.org, 客群: c.segment || p.客群,
        聯絡人: c.contact || p.聯絡人, 電話: c.phone || c.mobile || p.電話 };
      /* 外訪：預估人流沒填過才帶入學生人數，已經填的不蓋掉 */
      if (p.類別 === "外訪") {
        const vv = theVisit(p);
        if (!String(vv.預估人流 || "").trim() && c.students)
          nx.外訪 = { ...vv, 預估人流: String(c.students) };
      }
      return nx;
    });
  };

  /** 表單裡直接建一筆新客戶，存完自動選起來 */
  const saveNewCustomer = async () => {
    if (!newCust.org.trim()) return say && say("填一下單位名稱");
    const { data, error } = await sb.from("customers")
      .insert({ ...newCust, created_by: (me && me.name) || "" }).select().single();
    if (error) return say && say(clean(error.message));
    await (onCustomerSaved ? onCustomerSaved() : Promise.resolve());
    setF((p) => ({ ...p, 客戶id: data.id, 單位: data.org, 客群: data.segment || p.客群,
                   聯絡人: data.contact || p.聯絡人, 電話: data.phone || data.mobile || p.電話 }));
    setNewCust(null); say && say("客戶已建立並帶入");
  };

  const setPay = (i, k, v) => setF((p) => {
    const rows = [...(p.收款 || [])];
    rows[i] = { ...rows[i], [k]: v };
    if (k === "已付" && v && !rows[i].方式) rows[i].方式 = "匯款";
    return { ...p, 收款: rows };
  });
  const addPay = () => setF((p) => ({ ...p, 收款: [...(p.收款 || []), blankPay()] }));

  /* ---- 報價明細：選產品帶出名稱與售價，之後還能逐列改 ---- */
  const setItem = (i, k, v) => setF((p) => {
    const rows = [...(p.明細 || [])];
    rows[i] = { ...rows[i], [k]: v };
    if (k === "pid") {
      const pr = products.find((x) => x.id === v);
      if (pr) { rows[i].name = pr.name; rows[i].price = +pr.price || 0; }
      else { rows[i].name = ""; rows[i].price = 0; }
    }
    return { ...p, 明細: rows };
  });
  const addItem = () => setF((p) => ({ ...p, 明細: [...(p.明細 || []), blankItem()] }));
  const delItem = (i) => setF((p) => ({ ...p, 明細: (p.明細 || []).filter((_, k) => k !== i) }));
  /** 把明細算出來的金額丟進收款的第一列，之後收款才是金額的唯一真相 */
  const useItemsTotal = () => setF((p) => {
    const t = itemsTotal(p.明細);
    const rows = [...(p.收款 || [])];
    rows[0] = { ...(rows[0] || blankPay()), 類別: ticket ? "全額" : (rows[0]?.類別 || "訂金"), 金額: t };
    return { ...p, 收款: rows };
  });
  const delPay = (i) => setF((p) => {
    const rows = (p.收款 || []).filter((_, k) => k !== i);
    return { ...p, 收款: rows.length ? rows : [blankPay()] };
  });

  /** 包場＝場域內所有可獨立販售的品項一併保留，先幫使用者勾好，仍可調整 */
  const setBuyout = (on) =>
    setF((p) => on
      ? { ...p, 包場: true, 劇院: TH_ROOMS, PR廳數: PR_ROOMS }
      : { ...p, 包場: false });

  const s = useMemo(
    () => dayStats(orders, f.日期, editing?.id),
    [orders, f.日期, editing]
  );

  const slotLeft = f.場次 === "上" ? s.am : f.場次 === "下" ? s.pm : s.full;
  const child = +f.全票 || 0;
  const total = headcount(f);

  const errors = [];
  if (!f.單位.trim()) errors.push("填一下單位名稱");
  if (!f.業務窗口) errors.push("選一個業務窗口");
  if (!f.業務歸屬) errors.push("選一個業務歸屬");

  const overlaps = (a, b) => a === "全" || b === "全" || a === b;
  const lock = (ticket || visit) ? null
    : (f.場次 === "上" ? s.amLock : f.場次 === "下" ? s.pmLock : (s.amLock || s.pmLock));

  if (ticket) {
    /* 票務單不碰檔期，只檢查有沒有東西可賣 */
    if (!(f.明細 || []).some((r) => r.name)) errors.push("票務單至少要有一列明細");
  } else if (visit) {
    /* 外訪有日期但不佔名額，只檢查最低限度 */
    if (!f.日期) errors.push("外訪要填活動日期");
    const vt = toList(theVisit(f).活動類型);
    if (!vt.length) errors.push("至少選一個活動類型");
    if (vt.includes("其他")) errors.push("活動類型勾了「其他」，請填寫內容");
  } else {
    if (!f.日期) errors.push("活動單要填到訪日期");
    if (!f.包場 && f.場次 === "全" && isHoliday(f.日期))
      errors.push("假日強迫清場，全場僅開放包場。請改選上半場或下半場");
    if (lock) errors.push(`這個時段已被 ${lock.單位 || lock.單號} 包場，請改場次或改期`);
    const clash = s.eff.filter((o) => overlaps(o.場次, f.場次));
    if (f.包場 && clash.length > 0 && !lock)
      errors.push("這個時段已有其他訂單，包場需要獨佔，請改期或先處理既有訂單");
    if (!f.包場) {
      if (child <= 0) errors.push("全票人數要大於 0");
      if (child > slotLeft) errors.push(`全票超出可售名額，這個場次只剩 ${slotLeft} 位`);
      if (total > CAP_TOTAL) errors.push(`總人數超過容留上限 ${CAP_TOTAL} 位`);
    } else {
      if (child > CAP_CHILD) errors.push(`包場全票上限 ${CAP_CHILD} 位`);
      if (total > CAP_TOTAL) errors.push(`包場總人數上限 ${CAP_TOTAL} 位`);
    }
    if (+f.餐飲 > total && total > 0) errors.push(`餐飲數量超過總人數 ${total} 位`);
    if (f.PR廳數 > 0 && (!f.PR開始 || !f.PR結束)) errors.push("填上派對廳的起訖時間");
    if (f.PR廳數 > 0 && f.PR開始 && f.PR結束) {
      if (toMin(f.PR結束) <= toMin(f.PR開始)) {
        errors.push("派對廳結束時間要晚於開始時間");
      } else {
        const others = s.eff.filter((o) => o.PR廳數 > 0 && o.PR開始 && o.PR結束);
        const peak = prPeak(others, f.PR開始, f.PR結束, +f.PR廳數);
        if (peak > PR_ROOMS_AT_ONCE)
          errors.push(`派對廳 ${f.PR開始}–${f.PR結束} 這段時間會同時用到 ${peak} 廳，`
            + `超過 ${PR_ROOMS_AT_ONCE} 廳。請換時間或減少數量`);
      }
    }
  }

  const box = useRef(null);
  useEffect(() => {
    if (!inline) box.current?.scrollIntoView({ behavior: "smooth", block: "start" });
  }, [inline]);

  return (
    <div ref={box} className={inline ? "rounded" : "mt-4 rounded scroll-mt-4"}
      style={{ background: C.card, border: `1px solid ${inline ? C.line : C.brand}` }}>
      <div>

        <div className={inline ? "hidden" : "px-4 py-3 flex items-center justify-between"}
          style={{ background: C.card, borderBottom: `1px solid ${C.line}` }}>
          <h2 className="font-semibold">
            {editing
              ? `修改${ticket ? "票務單" : visit ? "外訪" : "需求"}　${editing.客戶ID}`
              : (ticket ? "新增票務單" : visit ? "新增外訪" : "登記團體需求")}
            <span className="ml-2 text-xs font-normal px-2 py-0.5 rounded"
              style={{ background: ticket ? C.card : C.brand,
                       color: ticket ? C.brand : "#fff",
                       border: `1px solid ${C.brand}` }}>{f.類別}</span>
          </h2>
          <button onClick={onClose} className="text-xl leading-none px-2" style={{ color: C.sub }}>×</button>
        </div>

        <div className="p-4 grid gap-3">
          <Row>
            <Field label="客戶" wide>
              <div className="flex gap-2">
                <select value={f.客戶id} style={inp}
                  onChange={(e) => pickCustomer(e.target.value)}>
                  <option value="">不指定（直接打單位名稱）</option>
                  {customers.filter((c) => c.active !== false).map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.org}{c.tax_id ? `（${c.tax_id}）` : ""}
                    </option>
                  ))}
                </select>
                <button onClick={() => setNewCust(blankCustomer())}
                  className="px-3 py-2 text-sm rounded whitespace-nowrap"
                  style={{ border: `1px solid ${C.line}` }}>新增客戶</button>
              </div>
            </Field>
          </Row>
          <Row>
            <Field label="單位名稱" wide>
              <input value={f.單位} onChange={(e) => set("單位", e.target.value)}
                placeholder="例：新北市土城區清水國小" style={inp} />
            </Field>
          </Row>
          <Row>
            <Field label="業務窗口">
              <select value={f.業務窗口} onChange={(e) => set("業務窗口", e.target.value)} style={inp}>
                <option value="">請選擇</option>
                {reps.filter((r) => r.active !== false).map((r) => (
                  <option key={r.id} value={r.name}>{r.name}</option>
                ))}
              </select>
            </Field>
            <AssignPicker assigns={assigns} value={f.業務歸屬}
              onChange={(v) => set("業務歸屬", v)} />
            <Field label="客群">
              <select value={f.客群} onChange={(e) => set("客群", e.target.value)} style={inp}>
                {SEGMENTS.map((x) => <option key={x}>{x}</option>)}
              </select>
            </Field>
            <Field label="聯絡人">
              <input value={f.聯絡人} onChange={(e) => set("聯絡人", e.target.value)} style={inp} />
            </Field>
            <Field label="電話">
              <input value={f.電話} onChange={(e) => set("電話", e.target.value)} style={inp} />
            </Field>
          </Row>

          {ticket && (
            <div className="rounded p-3 text-xs" style={{ background: C.paper, color: C.sub }}>
              票務單不佔檔期，也不進月曆。如果之後確定了到訪日期，
              回來把類別改成「活動」就會開始佔名額。
            </div>
          )}

          {visit && (
            <div className="rounded p-3" style={{ background: C.paper }}>
              <Row>
                <Field label="活動日期">
                  <input type="date" value={f.日期}
                    onChange={(e) => set("日期", e.target.value)} style={inp} />
                </Field>
              </Row>
              <p className="text-xs mt-2" style={{ color: C.sub }}>
                外訪是走出去，不佔樂園名額、不進月曆。上面的客戶欄選學校，
                校園資料會從客戶建檔帶出來，同一間學校辦第二場不用重打。
              </p>
            </div>
          )}

          {!ticket && !visit && (
          <div className="rounded p-3" style={{ background: C.paper }}>
            <Row>
              <Field label="到訪日期">
                <input type="date" value={f.日期} onChange={(e) => set("日期", e.target.value)} style={inp} />
              </Field>
              <Field label="包場">
                <select value={f.包場 ? "是" : "否"} onChange={(e) => setBuyout(e.target.value === "是")} style={inp}>
                  <option>否</option><option>是</option>
                </select>
              </Field>
              <Field label={f.包場 ? "包場範圍" : "場次"}>
                <select value={f.場次} onChange={(e) => set("場次", e.target.value)} style={inp}>
                  <option value="上">上半場</option>
                  <option value="下">下半場</option>
                  {(f.包場 || !isHoliday(f.日期)) && <option value="全">全場</option>}
                </select>
              </Field>
            </Row>
            <p className="text-xs mt-2 tnum" style={{ color: C.sub }}>
              {isHoliday(f.日期) ? "假日" : "平日"}　{sessionTime(f.日期, f.場次)}
              {!s.buyout && !f.包場 && `　可售全票 ${slotLeft}`}
            </p>
          </div>
          )}

          {!ticket && !visit && (
          <Row>
            <Field label="全票 3-17 歲">
              <input type="number" min="0" value={f.全票} onChange={(e) => set("全票", e.target.value)} style={inp} />
            </Field>
            <Field label="半票 18 歲以上">
              <input type="number" min="0" value={f.半票} onChange={(e) => set("半票", e.target.value)} style={inp} />
            </Field>
            <Field label="免票 未滿 3 歲">
              <input type="number" min="0" value={f.免票} onChange={(e) => set("免票", e.target.value)} style={inp} />
            </Field>
            <Field label="愛心票">
              <input type="number" min="0" value={f.愛心} onChange={(e) => set("愛心", e.target.value)} style={inp} />
            </Field>
          </Row>
          )}

          {!ticket && !visit && (
          <div className="rounded p-3 grid gap-2" style={{ background: C.paper }}>
            <div className="flex items-baseline justify-between">
              <span className="text-xs font-medium">加購品項</span>
              {f.包場 && (
                <span className="text-xs" style={{ color: C.brand }}>
                  包場已自動保留全部場地，仍可調整
                </span>
              )}
            </div>
            <Row>
              <Field label="餐飲　數量">
                <input type="number" min="0" value={f.餐飲}
                  onChange={(e) => set("餐飲", +e.target.value || 0)} style={inp} />
              </Field>
              <Field label={`劇院　數量（上限 ${TH_ROOMS}）`}>
                <select value={f.劇院} onChange={(e) => set("劇院", +e.target.value)} style={inp}>
                  <option value={0}>0</option><option value={1}>1</option>
                </select>
              </Field>
              <Field label={`派對廳　數量（同時最多 ${PR_ROOMS_AT_ONCE} 廳）`}>
                <select value={f.PR廳數} onChange={(e) => set("PR廳數", +e.target.value)} style={inp}>
                  <option value={0}>0</option><option value={1}>1</option><option value={2}>2</option>
                </select>
              </Field>
              {f.PR廳數 > 0 && (
                <>
                  <Field label="派對廳　開始">
                    <select value={f.PR開始} onChange={(e) => set("PR開始", e.target.value)} style={inp}>
                      <option value="">請選擇</option>
                      {prStartOptions(f.日期).map((x) => <option key={x}>{x}</option>)}
                    </select>
                  </Field>
                  <Field label="派對廳　結束">
                    <select value={f.PR結束} onChange={(e) => set("PR結束", e.target.value)}
                      disabled={!f.PR開始} style={inp}>
                      <option value="">請選擇</option>
                      {prEndOptions(f.日期, f.PR開始).map((x) => <option key={x}>{x}</option>)}
                    </select>
                  </Field>
                </>
              )}
              {f.PR廳數 > 0 && (
                <Field label={`派對方案（每廳 ${PR_PER_ROOM} 位）`} wide>
                  <select value={f.PR方案} onChange={(e) => set("PR方案", e.target.value)} style={inp}>
                    <option value="">請選擇</option>
                    {PARTY_PLANS.map((p) => <option key={p}>{p}</option>)}
                  </select>
                </Field>
              )}
            </Row>
            <p className="text-xs" style={{ color: C.sub }}>
              劇院 {TH_SEATS} 席・派對廳每廳 {PR_PER_ROOM} 位・
              實體 {PR_ROOMS_AT_ONCE} 廳，同一時間最多 {PR_ROOMS_AT_ONCE} 廳
            </p>
          </div>
          )}

          {!visit && (
            <ItemsBox f={f} products={products} ticket={ticket}
              setItem={setItem} addItem={addItem} delItem={delItem} useTotal={useItemsTotal} />
          )}

          {visit && <VisitBox v={theVisit(f)} setV={setV} products={products} />}

          {!visit && (
          <div className="rounded p-3 grid gap-2" style={{ background: C.paper }}>
            <div className="flex items-baseline justify-between flex-wrap gap-2">
              <span className="text-xs font-medium">金額與收款（最多 {PAY_MAX} 列）</span>
              <span className="text-xs tnum" style={{ color: C.sub }}>
                預估營收 <span style={{ color: C.brand, fontWeight: 600 }}>
                  NT$ {money(estRevenue(f.收款 || []))}
                </span>
                　已付 <span style={{ color: C.okText, fontWeight: 600 }}>
                  NT$ {money(paidAmount(f.收款 || []))}
                </span>
              </span>
            </div>

            {(f.收款 || []).map((r, i) => (
              <div key={i} className="flex gap-2 flex-wrap items-end">
                <label className="grid gap-1" style={{ flex: "1 1 6rem", minWidth: "5.5rem" }}>
                  {i === 0 && <span className="text-xs" style={{ color: C.sub }}>類別</span>}
                  <select value={r.類別} style={inp}
                    onChange={(e) => setPay(i, "類別", e.target.value)}>
                    {PAY_KINDS.map((x) => <option key={x}>{x}</option>)}
                  </select>
                </label>
                <label className="grid gap-1" style={{ flex: "1 1 7rem", minWidth: "6rem" }}>
                  {i === 0 && <span className="text-xs" style={{ color: C.sub }}>金額</span>}
                  <input type="text" inputMode="numeric" value={r.金額 === "" ? "" : money(r.金額)}
                    className="tnum" style={{ ...inp, textAlign: "right" }}
                    onChange={(e) => setPay(i, "金額", e.target.value.replace(/[^0-9]/g, ""))} />
                </label>
                <label className="grid gap-1" style={{ flex: "1 1 8rem", minWidth: "8rem" }}>
                  {i === 0 && <span className="text-xs" style={{ color: C.sub }}>預計付款日</span>}
                  <input type="date" value={r.預計日} style={inp}
                    onChange={(e) => setPay(i, "預計日", e.target.value)} />
                </label>
                <label className="grid gap-1" style={{ flex: "1 1 6rem", minWidth: "5.5rem" }}>
                  {i === 0 && <span className="text-xs" style={{ color: C.sub }}>付款方式</span>}
                  <select value={r.方式} style={inp}
                    onChange={(e) => setPay(i, "方式", e.target.value)}>
                    <option value="">未指定</option>
                    {PAY_WAYS.map((x) => <option key={x}>{x}</option>)}
                  </select>
                </label>
                <label className="flex items-center gap-1.5 pb-2" style={{ flex: "0 0 auto" }}>
                  <input type="checkbox" checked={!!r.已付}
                    onChange={(e) => setPay(i, "已付", e.target.checked)}
                    style={{ width: 16, height: 16, accentColor: C.brand }} />
                  <span className="text-xs" style={{ color: r.已付 ? C.okText : C.sub,
                    fontWeight: r.已付 ? 600 : 400 }}>已付款</span>
                </label>
                <button onClick={() => delPay(i)} className="px-2 py-1.5 text-xs rounded"
                  style={{ color: C.badText }} aria-label="刪除這一列">移除</button>
              </div>
            ))}

            {(f.收款 || []).length < PAY_MAX && (
              <button onClick={addPay} className="px-3 py-1.5 text-sm rounded self-start"
                style={{ border: `1px solid ${C.line}` }}>新增一列</button>
            )}
            <p className="text-xs" style={{ color: C.sub }}>
              保證金可退，不計入預估營收。勾了「已付款」才算已付。
            </p>
          </div>
          )}

          <Field label="備註" wide>
            <textarea rows={2} value={f.備註} onChange={(e) => set("備註", e.target.value)} style={inp} />
          </Field>

          {errors.length > 0 && (
            <ul className="rounded p-3 text-sm" style={{ background: C.badBg, color: C.badText }}>
              {errors.map((e, i) => <li key={i}>{e}</li>)}
            </ul>
          )}

          <p className="text-xs" style={{ color: C.sub }}>
            {editing
              ? `狀態維持「${editing.狀態}」，${ticket ? "票務單不影響名額。" : "名額會依新內容重算。"}`
              : ticket
                ? "送出後進任務列表，和活動單同一份清單，可以用類別篩選。不佔名額、不進月曆。"
                : visit
                  ? "送出後狀態是「籌備中」，之後推進到行程確認、已完成。可以在表單介面印出訪單。"
                  : "送出後檔期進入預留並開始計算天數。要不要卸下檔期由業務自行判斷，系統不會自動釋出。"}
          </p>
        </div>

        <div className="px-4 py-3 flex gap-2 flex-wrap"
          style={{ background: C.card, borderTop: `1px solid ${C.line}` }}>
          {inline ? <span className="flex-1" /> : (
            <button onClick={onClose} className="px-4 py-2 text-sm rounded flex-1"
              style={{ border: `1px solid ${C.line}` }}>取消</button>
          )}
          {inline && editing && onSaveAsNew && (
            <button disabled={errors.length > 0}
              onClick={() => onSaveAsNew({ ...f, 負責窗口: f.業務窗口, 收款: [], 明細: [],
                外訪: theVisit(f), 預估營收: 0, 場次: "", 包場: false,
                全票: 0, 半票: 0, 免票: 0, 愛心: 0, 餐飲: 0, 劇院: 0, PR廳數: 0 })}
              className="px-4 py-2 text-sm rounded"
              style={errors.length ? { border: `1px solid ${C.line}`, color: C.sub }
                                   : { border: `1px solid ${C.brand}`, color: C.brand }}>
              另存為新的一場
            </button>
          )}
          <button disabled={errors.length > 0}
            onClick={() => { const flat = ticket || visit; onSubmit({ ...f, 負責窗口: f.業務窗口,
              收款: visit ? [] : (f.收款 || []).filter((r) => +r.金額 > 0),
              明細: visit ? [] : (f.明細 || []).filter((r) => r.name),
              外訪: visit ? theVisit(f) : {},
              預估營收: visit ? 0 : estRevenue(f.收款 || []),
              日期: ticket ? "" : f.日期, 場次: flat ? "" : f.場次,
              包場: flat ? false : f.包場,
              全票: flat ? 0 : +f.全票 || 0, 半票: flat ? 0 : +f.半票 || 0,
              免票: flat ? 0 : +f.免票 || 0, 愛心: flat ? 0 : +f.愛心 || 0,
              餐飲: flat ? 0 : +f.餐飲 || 0,
              劇院: flat ? 0 : +f.劇院 || 0, PR廳數: flat ? 0 : +f.PR廳數 || 0 }); }}
            className={inline ? "px-5 py-2 text-sm rounded" : "px-4 py-2 text-sm rounded flex-1"}
            style={errors.length
              ? { background: C.line, color: C.sub }
              : { background: C.brand, color: "#fff" }}>
            {editing ? "儲存修改" : (ticket ? "建立票務單" : visit ? "新增" : "登記並暫留檔期")}
          </button>
        </div>
      </div>

      {newCust && (
        <Modal title="新增客戶" onClose={() => setNewCust(null)} onSave={saveNewCustomer} wide
          saveLabel="建立並帶入">
          <CustomerForm edit={newCust} setEdit={setNewCust} />
        </Modal>
      )}
    </div>
  );
}

const inp = {
  width: "100%", padding: "7px 9px", borderRadius: 4,
  border: `1px solid ${C.line}`, background: "#fff", fontSize: 14, color: C.ink,
};
const Row = ({ children }) => <div className="flex flex-wrap gap-3">{children}</div>;
function Field({ label, children, wide }) {
  return (
    <label className="grid gap-1" style={{ flex: wide ? "1 1 100%" : "1 1 8rem", minWidth: "8rem" }}>
      <span className="text-xs" style={{ color: C.sub }}>{label}</span>
      {children}
    </label>
  );
}

/* ---------------------------------------------------------------- 任務板 */
function TaskView({ orders, onMove, onRemove, onEdit, onField, onRestore, onNew, onSheet }) {
  const [filter, setFilter] = useState("進行中");
  const [cats, setCats] = useState(CATEGORIES);          // 勾哪些就看哪些
  const toggleCat = (k) => setCats((p) =>
    p.includes(k) ? (p.length > 1 ? p.filter((x) => x !== k) : p) : [...p, k]);
  const pool = orders.filter((o) => cats.includes(o.類別 || "活動"));
  const END = ["已結案", "流失", "已到訪", "已完成"];
  const live = pool.filter((o) => !END.includes(o.狀態)).sort(byCatDate);
  const done = pool.filter((o) => END.includes(o.狀態)).sort(byCatDate);
  const list = filter === "進行中" ? live : done;

  if (!orders.length) {
    return (
      <div className="rounded p-8 text-center" style={{ background: C.card, border: `1px dashed ${C.line}` }}>
        <p className="font-medium">還沒有任何單</p>
        <p className="text-sm mt-1 mb-3" style={{ color: C.sub }}>
          有檔期的到「檔期」頁點日期登記；沒有檔期的直接建票務單或外訪。
        </p>
        {onNew && (
          <div className="flex gap-2 justify-center">
            <button onClick={() => onNew("票務")} className="px-4 py-2 text-sm rounded"
              style={{ border: `1px solid ${C.brand}`, color: C.brand }}>新增票務單</button>
            <button onClick={() => onNew("外訪")} className="px-4 py-2 text-sm rounded"
              style={{ background: C.brand, color: "#fff" }}>新增外訪</button>

/** 把上傳或貼上的資料整理成 {day, note, kind}，看不懂的列直接丟掉 */
function parseCalendar(raw) {
  const norm = (v) => {
    if (v instanceof Date) return iso(v);
    if (typeof v === "number")            // Excel 序列日期
      return iso(new Date(Date.UTC(1899, 11, 30 + v)));
    const t = String(v || "").trim().replace(/[./]/g, "-");
    const m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
  };
  const kindOf = (v) => {
    const t = String(v || "").trim();
    if (/假/.test(t) && !/^平/.test(t)) return "假日";
    if (/平|工作|上班/.test(t)) return "平日";
    return "";
  };
  const out = [], seen = new Set();
  for (const r of raw) {
    const day = norm(r[0]), kind = kindOf(r[2]);
    if (!day || !kind || seen.has(day)) continue;
    seen.add(day);
    out.push({ day, note: String(r[1] || "").trim(), kind });
  }
  return out;
}

function CalendarAdmin({ cal, onSave, onDelete, say }) {
  const [preview, setPreview] = useState(null);
  const [text, setText] = useState("");
  const file = useRef(null);

  const takeFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { cellDates: true });
      const sh = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true });
      const parsed = parseCalendar(rows);
      parsed.length ? setPreview(parsed) : say("讀不到可用的資料，請確認三欄順序為 日期／說明／平假日");
    } catch (err) {
      say("檔案讀取失敗，請改用貼上");
    }
    e.target.value = "";
  };

  const takeText = () => {
    const rows = text.trim().split(/\r?\n/).map((l) => l.split(/\t|,/));
    const parsed = parseCalendar(rows);
    parsed.length ? setPreview(parsed) : say("讀不到可用的資料，一行一天，用 Tab 或逗號分隔");
  };

  const commit = async () => {
    if (await onSave(preview)) { setPreview(null); setText(""); }
  };

  const holi = cal.filter((r) => r.kind === "假日").length;

  return (
    <>
      <div className="rounded p-4 mb-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <h2 className="font-semibold">匯入平假日定義</h2>
        <p className="text-xs mt-1 mb-3" style={{ color: C.sub }}>
          三欄，順序固定：<span className="tnum">日期</span>／說明／平假日。
          日期可用 2027-01-01 或 2027/1/1；第三欄寫「平日」或「假日」。
          第一列是標題也沒關係，讀不懂的列會自動略過。同一天重複匯入會覆蓋舊的。
        </p>

        <div className="flex gap-2 flex-wrap items-center">
          <button onClick={() => file.current?.click()}
            className="px-3 py-2 text-sm rounded" style={{ background: C.brand, color: "#fff" }}>
            上傳 Excel 或 CSV
          </button>
          <input ref={file} type="file" accept=".xlsx,.xls,.csv" onChange={takeFile} className="hidden" />
          <span className="text-xs" style={{ color: C.sub }}>或直接貼上 ↓</span>
        </div>

        <textarea rows={4} value={text} onChange={(e) => setText(e.target.value)}
          placeholder={"2027-01-01\t元旦\t假日\n2027-01-02\t\t假日\n2027-01-04\t\t平日"}
          style={{ ...inp, marginTop: 8, fontFamily: "inherit" }} />
        <button onClick={takeText} disabled={!text.trim()}
          className="mt-2 px-3 py-2 text-sm rounded"
          style={text.trim() ? { border: `1px solid ${C.line}` } : { background: C.line, color: C.sub }}>
          讀取貼上的內容
        </button>
      </div>

      {preview && (
        <div className="rounded p-4 mb-4" style={{ background: C.card, border: `2px solid ${C.brand}` }}>
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <p className="font-medium tnum">
              讀到 {preview.length} 個日期
              <span className="text-xs font-normal ml-2" style={{ color: C.sub }}>
                假日 {preview.filter((r) => r.kind === "假日").length}・
                平日 {preview.filter((r) => r.kind === "平日").length}
              </span>
            </p>
            <div className="flex gap-2">
              <button onClick={() => setPreview(null)} className="px-3 py-1.5 text-sm rounded"
                style={{ border: `1px solid ${C.line}` }}>取消</button>
              <button onClick={commit} className="px-3 py-1.5 text-sm rounded"
                style={{ background: C.brand, color: "#fff" }}>確認寫入</button>
            </div>
          </div>
          <ul className="mt-3 text-xs grid gap-1" style={{ maxHeight: 200, overflowY: "auto" }}>
            {preview.map((r) => (
              <li key={r.day} className="tnum flex gap-3">
                <span style={{ minWidth: "6rem" }}>{r.day}</span>
                <span style={{ color: r.kind === "假日" ? C.brand : C.sub, minWidth: "3rem" }}>{r.kind}</span>
                <span style={{ color: C.sub }}>{r.note}</span>
              </li>
            ))}
          </ul>
        </div>
      )}

      <div className="rounded" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <div className="px-4 py-3 flex items-baseline justify-between"
          style={{ borderBottom: `1px solid ${C.line}` }}>
          <h2 className="font-semibold">目前的定義</h2>
          <span className="text-xs tnum" style={{ color: C.sub }}>
            共 {cal.length} 天・假日 {holi}
          </span>
        </div>
        {cal.length === 0 ? (
          <p className="p-4 text-sm" style={{ color: C.sub }}>
            還沒有任何定義。沒定義的日期一律用週末判斷：週六日算假日，週一到五算平日。
          </p>
        ) : (
          <ul className="text-sm">
            {cal.map((r) => (
              <li key={r.day} className="px-4 py-2 flex items-center gap-3"
                style={{ borderBottom: `1px solid ${C.line}` }}>
                <span className="tnum" style={{ minWidth: "6.5rem" }}>{r.day}</span>
                <span className="text-xs px-2 py-0.5 rounded"
                  style={r.kind === "假日"
                    ? { background: C.badBg, color: C.badText }
                    : { background: C.paper, color: C.sub }}>{r.kind}</span>
                <span className="text-xs" style={{ color: C.sub }}>{r.note}</span>
                <button onClick={() => onDelete(r.day)}
                  className="ml-auto px-2 py-1 text-xs rounded" style={{ color: C.badText }}>刪除</button>
              </li>
            ))}
          </ul>
        )}
      </div>
    </>
  );
}

          <col style={{ width: "20%" }} /><col style={{ width: "13%" }} />
