        <tbody>
          <tr>{L("攤位停留人次")}{D((v.成效 || {}).停留)}
              {L("接觸 Key man")}{D((v.成效 || {}).keyman)}
              {L("新增粉專追蹤")}{D((v.成效 || {}).粉專)}</tr>
          <tr>{L("預約參訪組數")}{D((v.成效 || {}).預約)}
              {L("取得名片／名單")}{D((v.成效 || {}).名片, 3)}</tr>
          {[["做得好的地方", "好"], ["遇到的問題", "問題"],
            ["下次要調整", "調整"], ["後續追蹤", "追蹤"]].map(([lab, k]) => (
            <tr key={k}><td style={SH.lab}>{lab}</td>
              <td style={SH.blank} colSpan={5}>{(v.檢討 || {})[k]}</td></tr>
          ))}
        </tbody>
      </table>

      <p style={SH.note}>
        承辦業務：{rep ? `${rep.name}　分機 ${rep.ext}　${rep.email}` : (o.負責窗口 || "")}
        　｜　KidZania Taipei 孩享趣股份有限公司
      </p>
    </div>
  );
}

/** 2 樓：進來就能寫。右上角調用既有記錄，右下角新增或儲存。 */
function FormsView({ sheet, setSheet, orders, customers, reps, assigns, products, me,
                     editing, setEditing, onSubmit, onSaveAsNew, say }) {
  const [callOpen, setCallOpen] = useState(false);
  const visits = orders.filter(isVisit).sort(byDate);
  const saved = editing ? orders.find((x) => x.id === editing.id) : null;
  const customer = saved ? customers.find((c) => c.id === saved.客戶id) : null;
  const rep = saved ? reps.find((r) => r.name === saved.負責窗口) : null;

  if (sheet === "報價單") {
    return (
      <>
        <SheetTabs sheet={sheet} setSheet={setSheet} />
        <div className="rounded p-8 text-center"
          style={{ background: C.card, border: `1px dashed ${C.line}` }}>
          <p className="font-medium">報價單</p>
          <p className="text-sm mt-1" style={{ color: C.sub }}>
            先架殼。等出訪單的格式定了，再把報價單搬進來。
          </p>
        </div>
      </>
    );
  }

  return (
    <>
      <div className="flex gap-1 mb-3 flex-wrap items-center">
        <SheetTabs sheet={sheet} setSheet={setSheet} inline />
        <span className="flex-1" />
        {saved && (
          <span className="text-xs tnum mr-1" style={{ color: C.brand }}>
            修改中　{saved.單號 || saved.單位}
          </span>
        )}
        <button onClick={() => setCallOpen(true)} className="px-3 py-1.5 text-sm rounded"
          style={{ border: `1px solid ${C.brand}`, color: C.brand }}>
          調用　<span className="tnum">{visits.length}</span>
        </button>
        {editing && (
          <button onClick={() => setEditing(null)} className="px-3 py-1.5 text-sm rounded"
            style={{ border: `1px solid ${C.line}`, color: C.sub }}>清空重寫</button>
        )}
        {saved && (
          <button onClick={() => window.print()} className="px-4 py-1.5 text-sm rounded"
            style={{ background: C.brand, color: "#fff" }}>列印 ／ 存成 PDF</button>
        )}
      </div>

      {saved && (
        <p className="text-xs mb-3" style={{ color: C.sub }}>
          這一筆隨時都能回來改、改完隨時能印。列印的是
          <span style={{ fontWeight: 600, color: C.ink }}>已儲存</span>的版本，
          所以出門前記得先按「儲存修改」再按列印。
        </p>
      )}

      <RequestForm
        key={editing ? editing.id : "new"}
        inline date={null} orders={orders} editing={editing} kind="外訪"
        customers={customers} reps={reps} assigns={assigns} products={products} me={me}
        say={say} onClose={() => setEditing(null)} onSubmit={onSubmit}
        onSaveAsNew={onSaveAsNew} />

      {saved && (
        <>
          <div className="flex items-center gap-2 mt-5 mb-2 flex-wrap">
            <span className="text-xs font-medium" style={{ color: C.brand }}>
              出訪單預覽（已儲存的版本）
            </span>
            <span className="flex-1" />
            <button onClick={() => window.print()} className="px-4 py-2 text-sm rounded"
              style={{ background: C.brand, color: "#fff" }}>列印 ／ 存成 PDF</button>
          </div>
          <div id="sheetbox" className="rounded p-5"
            style={{ background: "#fff", border: `1px solid ${C.line}` }}>
            <VisitSheet o={saved} customer={customer} rep={rep} />
          </div>
          <p className="text-xs mt-2" style={{ color: C.sub }}>
            按「列印」只會印這張單，上面的表單和分頁列都不會跟著印出來。
          </p>
        </>
      )}

      {callOpen && (
        <Modal title="調用外訪記錄" onClose={() => setCallOpen(false)} wide>
          {visits.length === 0 ? (
            <p className="text-sm" style={{ color: C.sub }}>還沒有任何外訪記錄。</p>
          ) : (
            <ul className="grid gap-2">
              {visits.map((x) => (
                <li key={x.id}>
                  <button onClick={() => { setEditing(x); setCallOpen(false); }}
                    className="w-full text-left rounded p-3"
                    style={{ background: C.card,
                      border: `1px solid ${editing && editing.id === x.id ? C.brand : C.line}` }}>
                    <div className="font-medium">
                      {x.單位}
                      <span className="ml-2 text-xs font-normal" style={{ color: C.sub }}>
                        {x.狀態}
                      </span>
                      {editing && editing.id === x.id && (
                        <span className="ml-2 text-xs font-normal" style={{ color: C.brand }}>
                          目前這一筆
                        </span>
                      )}
                    </div>
                    <div className="text-xs mt-0.5 tnum" style={{ color: C.sub }}>
                      {x.日期 || "日期未定"}　{toText(theVisit(x).活動類型)}
                      物品 {(theVisit(x).物品 || []).length} 項　{x.單號}
                    </div>
                  </button>
                </li>
              ))}
            </ul>
          )}
          <p className="text-xs mt-3" style={{ color: C.sub }}>
            調用之後是修改這一筆，不是複製。要辦同一間學校的第二場，
            調用舊的、改日期、再按「另存為新的一場」。
          </p>
        </Modal>
      )}
    </>
  );
}

function SheetTabs({ sheet, setSheet, inline }) {
  return (
    <div className={inline ? "flex gap-1" : "flex gap-1 mb-3"}>
      {["出訪單", "報價單"].map((k) => (
        <button key={k} onClick={() => setSheet(k)} className="px-3 py-1.5 text-sm rounded"
          style={sheet === k ? { background: C.ink, color: C.paper }
                             : { color: C.sub, border: `1px solid ${C.line}` }}>{k}</button>
      ))}
    </div>
  );
}

/* ----------------------------------------------------------------- 匯出 */
const MONEY_COLS = ["預估總營收", "已付金額", "未付金額"];

function ExportView({ orders, say }) {
  const [busy, setBusy] = useState(false);
  const [cats, setCats] = useState(CATEGORIES);        // 勾哪些就匯出哪些
  const toggleCat = (k) => setCats((p) =>
    p.includes(k) ? (p.length > 1 ? p.filter((x) => x !== k) : p) : [...p, k]);
  const pool = orders.filter((o) => cats.includes(o.類別 || "活動"));

  const rows = [...pool].sort(byDate).map((o) => {
    const paid = paidAmount(payRows(o));
    const est = +o.預估營收 || 0;
    return {
      /* 前五欄是 AC 主要看的，順序固定不要動 */
      報價類別: o.類別 || "活動",
      預定日期: o.日期 || "",
      預定單位: o.單位,
      狀態: o.狀態,
      預估總營收: est,

      歸屬群組: assignGroup(o.業務歸屬),
      業務歸屬: assignLabel(o.業務歸屬),   /* 散客沒有線，這欄留空，看歸屬群組就好 */
      業務窗口: o.負責窗口 || "",
      預定總人數: headcount(o),
      已付金額: paid,
      未付金額: Math.max(0, est - paid),
      逾期未收: overdueAmount(payRows(o), todayISO()),

      單號: o.單號 || "",
      階段天數: stageLabel(o),
      客戶ID: o.客戶ID,
      客群: o.客群, 聯絡人: o.聯絡人, 電話: o.電話,
      日別: !o.日期 ? "" : isHoliday(o.日期) ? "假日" : "平日",
      場次: !o.場次 ? ""
        : (o.包場 ? "包場-" : "") + (o.場次 === "全" ? "全場" : o.場次 + "半場"),
      場次時間: o.日期 ? sessionTime(o.日期, o.場次) : "",
      包場: o.包場 ? "Y" : "N",
      全票: o.全票, 半票: o.半票, 免票: o.免票, 愛心票: o.愛心,
      餐飲數量: o.餐飲 || 0,
      劇院數量: o.劇院 || 0,
      派對廳數量: o.PR廳數 || 0,
      派對廳開始: o.PR開始 || "",
      派對廳結束: o.PR結束 || "",
      派對方案: o.PR方案 || "",
      收款明細: payRows(o).map((r) =>
        `${r.類別} ${money(r.金額)}${r.已付
          ? ` 已付${r.方式 ? " " + r.方式 : ""}${r.預計日 ? " " + r.預計日 : ""}`
          : `${r.預計日 ? ` 預計 ${r.預計日}` : ""} 未付`}`
      ).join("；"),
      建立日: o.建立, 佔用名額: occupies(o) && o.日期 ? "是" : "否",
      報價明細: itemsText(o.明細),
      外訪類型: isVisit(o) ? toText(theVisit(o).活動類型) : "",
      外訪時間: isVisit(o)
        ? [theVisit(o).進場, theVisit(o).開始, theVisit(o).撤場].filter(Boolean).join("／") : "",
      外訪預估支出: isVisit(o) ? (+theVisit(o).預估支出 || 0) : "",
      外訪成效: isVisit(o)
        ? Object.entries(theVisit(o).成效 || {})
            .filter(([, x]) => x).map(([k, x]) => `${k} ${x}`).join("；") : "",
      備註: o.備註,
    };
  });

  const daily = useMemo(() => {
    const set = [...new Set(orders.filter((o) => o.日期 && !isVisit(o) && !isTicket(o))
      .map((o) => o.日期))].sort();
    return set.map((d) => {
      const s = dayStats(orders, d);
      return {
        日期: d, 日別: isHoliday(d) ? "假日" : "平日",
        當日包場: s.buyout ? "Y" : "N",
        上半場可售: s.buyout ? 0 : s.am,
        下半場可售: s.buyout ? 0 : s.pm,
        全場可售: s.buyout ? 0 : s.full,
        佔名額筆數: s.eff.length,
      };
    });
  }, [orders]);

  const download = async () => {
    setBusy(true);
    try {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "預訂名單");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(daily), "每日現況");
      XLSX.writeFile(wb, `團體預訂_${todayISO()}.xlsx`);
      say("已匯出 Excel");
    } catch (e) {
      say("這個環境擋下了下載，請改用複製表格");
    }
    setBusy(false);
  };

  const copy = async () => {
    const head = Object.keys(rows[0] || {});
    const tsv = [head.join("\t"), ...rows.map((r) => head.map((h) => r[h]).join("\t"))].join("\n");
    try { await navigator.clipboard.writeText(tsv); say("已複製，貼進 Excel 就是完整表格"); }
    catch (e) { say("複製失敗，請手動選取"); }
  };

  if (!orders.length) {
    return <p className="text-sm" style={{ color: C.sub }}>還沒有資料可以匯出。</p>;
  }

  return (
    <>
      <div className="flex gap-2 mb-4 flex-wrap">
        <button onClick={download} disabled={busy} className="px-4 py-2 text-sm rounded"
          style={{ background: C.brand, color: "#fff" }}>
          {busy ? "產生中…" : "下載 Excel"}
        </button>
        <button onClick={copy} className="px-4 py-2 text-sm rounded"
          style={{ border: `1px solid ${C.line}` }}>複製表格</button>
      </div>
      <div className="rounded p-3 mb-3 flex gap-5 flex-wrap tnum"
        style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <span className="text-sm">
          <span style={{ color: C.sub }}>預估營收合計　</span>
          <span style={{ color: C.brand, fontWeight: 600 }}>
            NT$ {money(rows.reduce((a, r) => a + r.預估總營收, 0))}
          </span>
        </span>
        <span className="text-sm">
          <span style={{ color: C.sub }}>已付　</span>
          <span style={{ color: C.okText, fontWeight: 600 }}>
            NT$ {money(rows.reduce((a, r) => a + r.已付金額, 0))}
          </span>
        </span>
        <span className="text-sm">
          <span style={{ color: C.sub }}>未付　</span>
          <span style={{ fontWeight: 600 }}>
            NT$ {money(rows.reduce((a, r) => a + r.未付金額, 0))}
          </span>
        </span>
        <span className="text-sm">
          <span style={{ color: C.sub }}>逾期未收　</span>
          <span style={{ color: C.badText, fontWeight: 600 }}>
            NT$ {money(rows.reduce((a, r) => a + r.逾期未收, 0))}
          </span>
        </span>
      </div>

      <div className="flex gap-1.5 mb-3 flex-wrap items-center">
        <span className="text-xs" style={{ color: C.sub }}>只匯出勾起來的</span>
        {CATEGORIES.map((k) => {
          const on = cats.includes(k);
          return (
            <button key={k} onClick={() => toggleCat(k)} className="px-2.5 py-1.5 text-xs rounded"
              style={on ? { border: `1px solid ${C.brand}`, color: C.brand, background: C.card }
                        : { border: `1px solid ${C.line}`, color: C.sub, opacity: .55 }}>
              {on ? "☑" : "☐"} {k}
              <span className="ml-1 tnum">
                {orders.filter((o) => (o.類別 || "活動") === k).length}
              </span>
            </button>
          );
        })}
      </div>

      <p className="text-xs mb-3" style={{ color: C.sub }}>
        依預定日期由近到遠排序，沒有日期的排最後。兩個分頁：預訂名單是逐筆明細，每日現況是名額結果。
        之後要接營運部票務系統，照他們的匯入規格改欄名就好。
      </p>

      <div className="overflow-x-auto rounded" style={{ border: `1px solid ${C.line}`, background: C.card }}>
        <table className="text-xs" style={{ borderCollapse: "collapse", minWidth: "100%" }}>
          <thead>
            <tr>
              {Object.keys(rows[0]).map((h) => (
                <th key={h} className="px-2 py-1.5 text-left whitespace-nowrap"
                  style={{ borderBottom: `1px solid ${C.line}`, color: C.sub, fontWeight: 600 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                {Object.keys(rows[0]).map((h) => (
                  <td key={h} className="px-2 py-1.5 whitespace-nowrap tnum"
                    style={{ borderBottom: `1px solid ${C.line}`,
                             textAlign: MONEY_COLS.includes(h) ? "right" : "left" }}>
                    {MONEY_COLS.includes(h) ? money(r[h]) : String(r[h] ?? "")}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
